<title>Academia Byte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ===== LAYOUT: panel lateral + contenido; en móvil barra inferior ===== */
/* ===== DESIGN TOKENS ===== */
:root{
  --bg:#0e1020; --bg2:#141730; --surface:#1a1e3a; --surface2:#232a4d; --surface3:#2d3561;
  --fg:#eef1fb; --fg-soft:#c7cde8; --muted:#8c93b8; --faint:#616a94;
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.15);
  --brand:#f6c445; --brand-ink:#3a2c05;
  --redes:#2dd4bf; --ciber:#fb6a73; --sql:#5b9cff; --python:#ffcb47; --cpp:#b78bff; --juegos:#ff74c4; --ranking:#f6c445; --contacto:#57d98a;
  --matematica:#ff9d52; --programacion:#8fd14f; --ayso:#7d8cf5; --organizacion:#e06b9c; --estudio:#5ad1a0; --kali:#9aa7c7; --robotica:#b07cf0;
  --coin:#f6c445;
  --ok:#4ade80; --bad:#fb6a73; --warn:#fbbf4d; --info:#5b9cff;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); --shadow-sm:0 4px 14px -6px rgba(0,0,0,.5);
  --r-sm:9px; --r:14px; --r-lg:22px; --r-xl:30px;
  --f-display:"Fredoka",system-ui,sans-serif; --f-body:"Figtree",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --maxw:1040px; --rail:248px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef0f8; --bg2:#e6e9f5; --surface:#ffffff; --surface2:#f3f5fb; --surface3:#e9edf8;
  --fg:#181c33; --fg-soft:#2f3659; --muted:#5a6185; --faint:#8b92b4;
  --border:rgba(20,24,55,.1); --border2:rgba(20,24,55,.18);
  --brand:#e0a512; --brand-ink:#fff;
  --redes:#0d9488; --ciber:#e23744; --sql:#2f6ef0; --python:#c48a06; --cpp:#7c47e0; --juegos:#d6338f; --ranking:#d99a0c; --contacto:#1f9d57;
  --matematica:#d9772e; --programacion:#5a9e26; --ayso:#4f5fd0; --organizacion:#c23a72; --estudio:#1aa877; --kali:#5b6b93; --robotica:#9a5fe0;
  --shadow:0 12px 30px -14px rgba(40,50,90,.35); --shadow-sm:0 4px 14px -8px rgba(40,50,90,.3);
  color-scheme:light;
}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){
  --bg:#eef0f8; --bg2:#e6e9f5; --surface:#ffffff; --surface2:#f3f5fb; --surface3:#e9edf8;
  --fg:#181c33; --fg-soft:#2f3659; --muted:#5a6185; --faint:#8b92b4;
  --border:rgba(20,24,55,.1); --border2:rgba(20,24,55,.18);
  --brand:#e0a512; --brand-ink:#fff;
  --redes:#0d9488; --ciber:#e23744; --sql:#2f6ef0; --python:#c48a06; --cpp:#7c47e0; --juegos:#d6338f; --ranking:#d99a0c; --contacto:#1f9d57;
  --matematica:#d9772e; --programacion:#5a9e26; --ayso:#4f5fd0; --organizacion:#c23a72; --estudio:#1aa877; --kali:#5b6b93; --robotica:#9a5fe0;
  --shadow:0 12px 30px -14px rgba(40,50,90,.35); --shadow-sm:0 4px 14px -8px rgba(40,50,90,.3);
  color-scheme:light;
}}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.modal-open{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--sql)}
button{font-family:inherit}
::selection{background:var(--brand);color:var(--brand-ink)}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ambient background */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 500px at 15% -5%,color-mix(in srgb,var(--sql) 16%,transparent),transparent 60%),
             radial-gradient(800px 600px at 100% 0%,color-mix(in srgb,var(--juegos) 13%,transparent),transparent 55%),
             radial-gradient(700px 600px at 50% 110%,color-mix(in srgb,var(--redes) 12%,transparent),transparent 60%);}

/* ===== APP SHELL ===== */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100%;}
/* side rail */
.rail{position:sticky;top:env(safe-area-inset-top,0);align-self:start;height:100dvh;
  padding:18px 14px calc(18px + env(safe-area-inset-bottom,0)) max(14px,env(safe-area-inset-left,0));
  display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--border);
  background:linear-gradient(180deg,var(--bg2),var(--bg));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;text-decoration:none;color:var(--fg)}
.brand-logo{width:38px;height:38px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.18rem;letter-spacing:-.02em;line-height:1}
.brand-sub{font-size:.66rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r);border:none;background:transparent;color:var(--fg-soft);
  cursor:pointer;text-align:left;font-size:.92rem;font-weight:500;width:100%;transition:background .15s,color .15s;position:relative}
.nav-i:hover{background:var(--surface)}
.nav-i .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--muted)) 22%,transparent)}
.nav-i.active{background:var(--surface2);color:var(--fg);font-weight:600}
.nav-i.active::before{content:"";position:absolute;left:-14px;top:14%;bottom:14%;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--brand))}
.rail-foot{margin-top:auto;padding-top:12px}

/* viewer chip */
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);cursor:pointer;width:100%;text-align:left}
.me:hover{border-color:var(--border2)}
.me .av{width:40px;height:40px;flex:none}
.me-name{font-weight:600;font-size:.86rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-lvl{font-size:.7rem;color:var(--muted)}
.xpbar{height:5px;border-radius:5px;background:var(--surface3);overflow:hidden;margin-top:5px}
.xpbar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--brand),#ffe08a);transition:width .6s cubic-bezier(.22,1,.36,1)}

/* content */
.main{min-width:0;padding:0 0 80px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0));padding-right:max(20px,env(safe-area-inset-right,0))}
.topbar{position:sticky;top:env(safe-area-inset-top,0);z-index:20;backdrop-filter:blur(12px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--border)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0);z-index:30;background:var(--bg)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
.crumb{font-family:var(--f-display);font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:9px;min-width:0}
.crumb .pill{font-size:.68rem;padding:3px 9px;border-radius:20px;font-weight:700;font-family:var(--f-body);letter-spacing:.03em;flex:none}
.top-sp{flex:1}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--fg-soft);cursor:pointer;display:grid;place-items:center;flex:none}
.icon-btn:hover{border-color:var(--border2);color:var(--fg)}

/* ===== BUTTONS ===== */
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface2);color:var(--fg);font-weight:600;font-size:.9rem;
  padding:10px 16px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .08s,filter .15s,background .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--brand),#ffd778);color:var(--brand-ink);border-color:transparent}
.btn-ghost{background:transparent}
.btn-sm{padding:7px 12px;font-size:.82rem;border-radius:10px}
.btn-c{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,transparent);color:var(--fg)}

/* ===== HERO / HOME ===== */
.hero{padding:34px 0 10px}
.hero h1{font-size:clamp(1.9rem,5vw,3rem);font-weight:700;letter-spacing:-.025em}
.hero .lead{color:var(--fg-soft);font-size:clamp(1rem,2vw,1.18rem);max-width:60ch;margin-top:12px}
.hero .accent{background:linear-gradient(120deg,var(--brand),var(--juegos));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;min-width:120px}
.stat b{font-family:var(--f-display);font-size:1.5rem;display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}

/* module cards grid */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:16px;margin-top:10px}
.mod-card{position:relative;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-lg);padding:20px;cursor:pointer;overflow:hidden;transition:transform .14s,border-color .14s,box-shadow .14s}
.mod-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:var(--shadow)}
.mod-card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c)}
.mod-ic{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;margin-bottom:14px;
  background:color-mix(in srgb,var(--c) 20%,var(--surface2));color:var(--c)}
.mod-card h3{font-size:1.22rem;margin-bottom:5px}
.mod-card p{color:var(--muted);font-size:.86rem;margin:0}
.mod-meta{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.76rem;color:var(--faint);font-weight:600}
.mod-prog{height:6px;border-radius:6px;background:var(--surface3);overflow:hidden;margin-top:12px}
.mod-prog > i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .6s}

/* ===== SECTION / CONTENT ===== */
section.view{padding-top:22px;animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead-row{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.sec-head{margin-bottom:6px}
.sec-head h2{font-size:clamp(1.5rem,3.4vw,2.1rem);letter-spacing:-.02em}
.sec-head p{color:var(--fg-soft);margin-top:8px;max-width:65ch}
.why{border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface));padding:12px 16px;border-radius:0 var(--r) var(--r) 0;margin:16px 0;font-size:.92rem;color:var(--fg-soft)}
.why b{color:var(--fg)}

/* lesson list */
.lessons{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.lesson-card{display:flex;align-items:center;gap:14px;padding:15px 17px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-lg);cursor:pointer;transition:border-color .14s,transform .1s;text-align:left;width:100%}
.lesson-card:hover{border-color:color-mix(in srgb,var(--c) 50%,transparent);transform:translateX(3px)}
.lesson-n{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem;background:color-mix(in srgb,var(--c) 16%,var(--surface2));color:var(--c)}
.lesson-card.done .lesson-n{background:var(--ok);color:#06220f}
.lesson-info{min-width:0;flex:1}
.lesson-info h4{font-size:1.02rem}
.lesson-info .meta{font-size:.76rem;color:var(--muted);display:flex;gap:10px;margin-top:3px;flex-wrap:wrap}
.lvl-badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.02em}
.lvl-Básico{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.lvl-Intermedio{background:color-mix(in srgb,var(--warn) 24%,transparent);color:var(--warn)}
.lvl-Avanzado{background:color-mix(in srgb,var(--ciber) 24%,transparent);color:var(--ciber)}

/* lesson body */
.article{max-width:72ch}
.article > *{margin-top:15px}
.article h3{font-size:1.28rem;margin-top:30px;color:var(--fg)}
.article h3::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:9px;vertical-align:middle}
.article p{color:var(--fg-soft)}
.article b{color:var(--fg);font-weight:700}
.article ul,.article ol{color:var(--fg-soft);padding-left:22px;display:flex;flex-direction:column;gap:7px}
.article li{padding-left:3px}
.article code,.ic{font-family:var(--f-mono);font-size:.86em;background:var(--surface2);padding:1.5px 6px;border-radius:6px;color:var(--fg);border:1px solid var(--border)}
.callout{padding:13px 16px;border-radius:var(--r);font-size:.9rem;display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border)}
.callout .ci{flex:none;margin-top:1px}
.callout.tip{background:color-mix(in srgb,var(--ok) 11%,var(--surface));border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.callout.warn{background:color-mix(in srgb,var(--warn) 11%,var(--surface));border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.callout.info{background:color-mix(in srgb,var(--info) 11%,var(--surface));border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.callout.key{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:color-mix(in srgb,var(--c) 34%,transparent)}
.callout b{color:var(--fg)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);max-width:100%}
table.d{border-collapse:collapse;width:100%;font-size:.86rem;min-width:360px}
table.d th,table.d td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
table.d th{background:var(--surface2);font-weight:700;font-family:var(--f-display);color:var(--fg);white-space:nowrap;font-size:.82rem}
table.d tr:last-child td{border-bottom:none}
table.d td:first-child{font-weight:600;color:var(--fg)}
table.d tbody tr:hover{background:var(--surface2)}

/* code blocks */
.code{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:#0b0d1c;margin-top:16px}
:root[data-theme="light"] .code{background:#1a1e36}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .code{background:#1a1e36}}
.code-top{display:flex;align-items:center;gap:8px;padding:8px 13px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--border)}
.code-dots{display:flex;gap:5px}.code-dots i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.code-dots i:nth-child(2){background:#febc2e}.code-dots i:nth-child(3){background:#28c840}
.code-title{font-size:.74rem;color:#9aa3c8;font-family:var(--f-mono);margin-left:4px}
.code-copy{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.15);color:#c7cde8;font-size:.72rem;padding:3px 9px;border-radius:7px;cursor:pointer}
.code-copy:hover{background:rgba(255,255,255,.08)}
pre.src{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--f-mono);font-size:.82rem;line-height:1.6;color:#e6eafc}
pre.src .cm{color:#6b7394;font-style:italic}
pre.src .kw{color:#ff9ec4}
pre.src .st{color:#a6e3a1}
pre.src .nu{color:#f6c445}
pre.src .fn{color:#7fd6ff}
.code-out{border-top:1px dashed var(--border);padding:10px 16px;font-family:var(--f-mono);font-size:.8rem;color:#9fe6b0;white-space:pre-wrap}
.code-out .lbl{color:#6b7394;display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.run-row{display:flex;gap:8px;padding:9px 13px;border-top:1px solid var(--border);background:rgba(255,255,255,.02)}

/* diagrams */
.diagram{margin-top:16px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:14px;overflow-x:auto}
.diagram svg{display:block;margin:0 auto;max-width:100%;height:auto}

/* ===== EXERCISES ===== */
.ex{border:1px solid var(--border2);background:var(--surface);border-radius:var(--r-lg);padding:18px;margin-top:16px}
.ex-tag{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c);display:inline-flex;align-items:center;gap:6px;margin-bottom:9px}
.ex-q{font-weight:600;font-size:1.02rem;margin-bottom:14px}
.ex-q .ic{font-weight:500}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface2);cursor:pointer;text-align:left;font-size:.92rem;transition:border-color .12s,background .12s;width:100%;color:var(--fg)}
.opt:hover{border-color:var(--border2)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--surface3);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none;font-family:var(--f-display)}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface2))}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface2))}
.opt.correct .k{background:var(--ok);color:#06220f}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--surface2))}
.opt.wrong .k{background:var(--bad);color:#2a0608}
.opt[disabled]{cursor:default}
.ex-input{width:100%;padding:11px 14px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--bg2);color:var(--fg);font-family:var(--f-mono);font-size:.92rem}
.ex-input:focus{border-color:var(--c);outline:none}
.ex-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center}
.verdict{margin-top:14px;padding:13px 15px;border-radius:var(--r);font-size:.9rem;display:none;animation:fade .3s both}
.verdict.show{display:block}
.verdict.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.verdict.no{background:color-mix(in srgb,var(--bad) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 38%,transparent)}
.verdict .vh{font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:4px;font-family:var(--f-display)}
.verdict.ok .vh{color:var(--ok)}.verdict.no .vh{color:var(--bad)}
.verdict .xpget{color:var(--brand);font-weight:700}

/* code editor exercise */
.editor{border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;background:#0b0d1c;margin-bottom:10px}
:root[data-theme="light"] .editor{background:#161a30}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .editor{background:#161a30}}
.editor textarea{width:100%;border:none;background:transparent;color:#e6eafc;font-family:var(--f-mono);font-size:.84rem;line-height:1.6;padding:14px 16px;resize:vertical;min-height:120px;outline:none;tab-size:4}
.editor .ed-top{display:flex;align-items:center;padding:7px 12px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--border);font-family:var(--f-mono);font-size:.72rem;color:#9aa3c8;gap:8px}
.console{font-family:var(--f-mono);font-size:.8rem;background:#070912;border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;white-space:pre-wrap;color:#cdd4f0;max-height:220px;overflow:auto;margin-top:4px}
.console .ok{color:#9fe6b0}.console .err{color:#ff9 aa;color:#ff9eb0}.console .dim{color:#6b7394}

/* Parsons (ordenar) */
.parsons{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.parsons .pz{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1.5px solid var(--border2);border-radius:10px;background:var(--surface2);cursor:grab;font-family:var(--f-mono);font-size:.84rem;user-select:none}
.parsons .pz:active{cursor:grabbing}
.parsons .pz.drag{opacity:.4}
.parsons .pz.over{border-color:var(--c)}
.parsons .pz .h{color:var(--faint);font-size:1rem;flex:none}
.parsons .pz .mv{margin-left:auto;display:flex;gap:3px}
.parsons .pz .mv button{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--surface3);color:var(--fg-soft);cursor:pointer;font-size:.8rem}

/* ===== GLOSSARY / RECAP ===== */
.recap{border:1px dashed var(--border2);border-radius:var(--r-lg);padding:18px;margin-top:26px;background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.recap h4{font-size:1.05rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.recap .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.recap ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--fg-soft)}
.recap .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin-bottom:6px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:16px}
.gloss .g{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.gloss .g b{font-family:var(--f-mono);font-size:.84rem;color:var(--c)}
.gloss .g p{font-size:.82rem;color:var(--muted);margin:5px 0 0}

/* lesson nav footer */
.lnav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;padding-top:20px;border-top:1px solid var(--border)}

/* progress ring on lesson complete */
.complete-banner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r-lg);background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 22%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);margin-top:20px}

/* ===== SQL PLAYGROUND ===== */
.sqlpad{border:1px solid var(--border2);border-radius:var(--r-lg);overflow:hidden;margin-top:14px;background:var(--surface)}
.sqlpad .tabs{display:flex;gap:4px;padding:8px 10px;background:var(--surface2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.schema-chip{font-family:var(--f-mono);font-size:.72rem;padding:4px 9px;border-radius:7px;background:var(--surface3);color:var(--fg-soft);border:1px solid var(--border)}
.res-table{overflow:auto;max-height:280px;margin-top:8px;border:1px solid var(--border);border-radius:var(--r)}
.res-table table{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:.8rem}
.res-table th,.res-table td{padding:6px 11px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.res-table th{background:var(--surface2);position:sticky;top:0;font-weight:700}

/* ===== GAMES ===== */
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:18px}
.game-card{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-lg);padding:18px;cursor:pointer;transition:transform .14s,border-color .14s;text-align:left}
.game-card:hover{transform:translateY(-3px);border-color:var(--juegos)}
.game-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--juegos) 18%,var(--surface2));color:var(--juegos);margin-bottom:12px}
.game-card h4{font-size:1.1rem;margin-bottom:4px}
.game-card p{color:var(--muted);font-size:.84rem;margin:0}
.game-diff{display:inline-block;margin-top:12px;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--surface3);color:var(--fg-soft)}
.game-won{color:var(--ok);font-weight:700;font-size:.74rem;margin-top:10px;display:flex;align-items:center;gap:5px}

.g-stage{border:1px solid var(--border2);border-radius:var(--r-lg);background:var(--surface);padding:18px;margin-top:4px}
.g-score{display:flex;justify-content:center;gap:28px;font-size:.92rem;color:var(--fg-soft);margin-bottom:12px}
.g-score b{font-family:var(--f-display);font-size:1.3rem;color:var(--fg);font-variant-numeric:tabular-nums}
.g-msg{text-align:center;font-weight:600;min-height:1.5em;margin:12px 0;font-size:.96rem}
.g-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.g-choice{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 20px;border:1.5px solid var(--border2);border-radius:var(--r);background:var(--surface2);cursor:pointer;font-weight:600;min-width:92px}
.g-choice:hover{border-color:var(--juegos);transform:translateY(-2px)}
.g-choice .gi{font-size:2rem}
.g-input{padding:11px 14px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--bg2);color:var(--fg);font-size:1rem;width:140px;text-align:center}
.g-hist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.g-chip{font-family:var(--f-mono);font-size:.78rem;padding:4px 9px;border-radius:7px;font-weight:700}
.g-chip.ok{background:var(--ok);color:#06220f}.g-chip.lo{background:color-mix(in srgb,var(--info) 30%,var(--surface2));color:var(--info)}.g-chip.hi{background:color-mix(in srgb,var(--ciber) 26%,var(--surface2));color:var(--ciber)}

/* tictactoe */
.tt-board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:0 auto}
.tt-cell{aspect-ratio:1;border:1.5px solid var(--border2);border-radius:14px;background:var(--surface2);font-family:var(--f-display);font-size:2.2rem;font-weight:700;cursor:pointer;display:grid;place-items:center}
.tt-cell:hover{border-color:var(--juegos)}
.tt-x{color:var(--sql)}.tt-o{color:var(--juegos)}

/* ahorcado */
.ah-hang{text-align:center;font-size:1.5rem;letter-spacing:4px;margin-bottom:8px}
.ah-word{text-align:center;font-family:var(--f-mono);font-size:1.6rem;letter-spacing:6px;font-weight:700;margin:10px 0}
.ah-keys{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;max-width:420px;margin:14px auto 0}
.ah-key{aspect-ratio:1;border:1px solid var(--border2);border-radius:9px;background:var(--surface2);font-weight:700;text-transform:uppercase;cursor:pointer;font-size:.9rem}
.ah-key:hover:not([disabled]){border-color:var(--juegos)}
.ah-key.ah-hit{background:var(--ok);color:#06220f;border-color:transparent}
.ah-key.ah-miss{background:color-mix(in srgb,var(--bad) 30%,var(--surface2));color:var(--bad)}
.ah-key[disabled]{opacity:.9;cursor:default}

/* memoria */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:340px;margin:0 auto}
.mem-card{aspect-ratio:1;border:1.5px solid var(--border2);border-radius:13px;background:var(--surface3);font-size:1.6rem;cursor:pointer;display:grid;place-items:center;transition:transform .2s,background .2s}
.mem-card.up{background:var(--surface);transform:rotateY(0)}
.mem-card.done{background:color-mix(in srgb,var(--ok) 22%,var(--surface));border-color:var(--ok)}

/* simon */
.si-pad{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:260px;margin:0 auto;aspect-ratio:1}
.si-btn{border:none;border-radius:16px;cursor:pointer;opacity:.5;transition:opacity .12s,transform .1s}
.si-btn.on{opacity:1;transform:scale(1.04);box-shadow:0 0 24px currentColor}
.si-v{background:#2dd46e}.si-r{background:#fb5a63}.si-a{background:#4d8cff}.si-m{background:#f6c445}

/* ahorcado pista */
.ah-pista{text-align:center;font-size:.86rem;color:var(--fg-soft);margin:6px auto 2px;max-width:48ch;background:color-mix(in srgb,var(--juegos) 10%,var(--surface2));border:1px solid var(--border);border-radius:var(--r);padding:9px 14px}
.ah-pista b{color:var(--fg)}

/* ===== FOCUS / POMODORO ===== */
.focus-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;align-items:start}
@media(max-width:820px){.focus-grid{grid-template-columns:1fr}}
.pomo{border:1px solid var(--border2);background:var(--surface);border-radius:var(--r-lg);padding:22px;text-align:center}
.pomo-mode{display:inline-flex;gap:4px;background:var(--surface2);border-radius:20px;padding:4px;margin-bottom:18px}
.pomo-mode button{border:none;background:transparent;color:var(--fg-soft);padding:6px 16px;border-radius:16px;cursor:pointer;font-weight:600;font-size:.84rem}
.pomo-mode button.on{background:var(--c);color:var(--bg)}
.pomo-ring{position:relative;width:216px;height:216px;margin:0 auto}
.pomo-ring svg{transform:rotate(-90deg);display:block}
.pomo-ring .track{fill:none;stroke:var(--surface3);stroke-width:12}
.pomo-ring .bar{fill:none;stroke:var(--c);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.pomo-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pomo-face b{font-family:var(--f-display);font-size:2.9rem;font-variant-numeric:tabular-nums;line-height:1}
.pomo-face span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:6px}
.pomo-ctrls{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.study-pill{margin-top:16px;display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--brand) 16%,var(--surface2));color:var(--brand);border-radius:20px;padding:8px 16px;font-weight:700;font-size:.88rem}
.pomo-set{margin-top:20px;border-top:1px solid var(--border);padding-top:16px;display:flex;flex-direction:column;gap:13px;text-align:left}
.pomo-set .srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.86rem}
.pomo-set label{color:var(--fg-soft);min-width:92px;font-weight:600}
.pomo-set input[type=number]{width:60px;padding:7px 9px;border-radius:9px;border:1.5px solid var(--border2);background:var(--bg2);color:var(--fg);font-family:var(--f-mono);text-align:center}
.pomo-set select{padding:7px 9px;border-radius:9px;border:1.5px solid var(--border2);background:var(--bg2);color:var(--fg);flex:1}
.pomo-set input[type=range]{flex:1;min-width:110px;accent-color:var(--brand)}
.pomo-set .unit{color:var(--muted);font-size:.8rem}

/* tasks */
.tasks{border:1px solid var(--border2);background:var(--surface);border-radius:var(--r-lg);padding:22px}
.tasks h3{font-size:1.1rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.task-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.task-add input[type=text]{flex:1;min-width:130px;padding:10px 12px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--bg2);color:var(--fg)}
.task-add input[type=date]{padding:9px 11px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--bg2);color:var(--fg);font-family:inherit}
.task-list{display:flex;flex-direction:column;gap:9px;max-height:420px;overflow-y:auto}
.task{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--border);border-left:4px solid var(--tc,var(--border2));border-radius:var(--r);background:var(--surface2)}
.task.done{opacity:.55}
.task.done .task-txt{text-decoration:line-through}
.task-chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--border2);background:transparent;cursor:pointer;flex:none;display:grid;place-items:center;color:transparent}
.task.done .task-chk{background:var(--ok);border-color:var(--ok);color:#06220f}
.task-txt{flex:1;min-width:0;font-size:.92rem;word-break:break-word}
.task-due{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;background:color-mix(in srgb,var(--tc,var(--muted)) 20%,var(--surface));color:var(--tc,var(--muted))}
.task-del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:1.15rem;flex:none;line-height:1}
.task-del:hover{color:var(--bad)}
.task-empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:.88rem}

/* ranking mode toggle */
.rank-tabs{display:inline-flex;gap:4px;background:var(--surface2);border-radius:20px;padding:4px;margin-top:4px}
.rank-tabs button{border:none;background:transparent;color:var(--fg-soft);padding:6px 15px;border-radius:16px;cursor:pointer;font-weight:600;font-size:.84rem}
.rank-tabs button.on{background:var(--ranking);color:var(--bg)}

/* ===== RANKING ===== */
.rank-list{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.rank-row{display:flex;align-items:center;gap:13px;padding:12px 15px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r)}
.rank-row.me-row{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--surface))}
.rank-pos{width:34px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.rank-row.top1 .rank-pos{color:var(--brand)}.rank-row.top2 .rank-pos{color:#c7cde8}.rank-row.top3 .rank-pos{color:#d79a5b}
.rank-av{width:42px;height:42px;flex:none}
.rank-info{flex:1;min-width:0}
.rank-info b{font-size:.96rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-info span{font-size:.76rem;color:var(--muted)}
.rank-xp{font-family:var(--f-display);font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;flex:none}
.rank-empty{text-align:center;color:var(--muted);padding:40px 20px}

/* ===== ASSISTANT ===== */
.chat{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.chat-log{display:flex;flex-direction:column;gap:12px;min-height:160px}
.bub{max-width:85%;padding:12px 15px;border-radius:16px;font-size:.92rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.u{align-self:flex-end;background:linear-gradient(135deg,var(--brand),#ffd778);color:var(--brand-ink);border-bottom-right-radius:5px}
.bub.a{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:5px}
.bub.a code,.bub.a pre{font-family:var(--f-mono);font-size:.84em;background:#0b0d1c;color:#e6eafc;padding:2px 6px;border-radius:6px}
.bub.a pre{display:block;padding:12px;overflow-x:auto;white-space:pre}
.chat-in{display:flex;gap:9px;align-items:flex-end}
.chat-in textarea{flex:1;min-height:46px;max-height:140px;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--bg2);color:var(--fg);font-family:inherit;font-size:.92rem;resize:none}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.chip{font-size:.8rem;padding:7px 12px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--fg-soft);cursor:pointer}
.chip:hover{border-color:var(--c)}

/* ===== CONTACT ===== */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.82rem;font-weight:600;color:var(--fg-soft)}
.field input,.field textarea,.field select{padding:11px 13px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--bg2);color:var(--fg);font-family:inherit;font-size:.92rem}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--contacto);outline:none}
.contact-card{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-lg);padding:20px}
.contact-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.contact-item:last-child{border-bottom:none}
.contact-item .ci-ic{width:38px;height:38px;border-radius:11px;background:color-mix(in srgb,var(--contacto) 18%,var(--surface2));color:var(--contacto);display:grid;place-items:center;flex:none}
.contact-item .val{font-family:var(--f-mono);font-size:.86rem;color:var(--fg);word-break:break-all}
.contact-item .lbl{font-size:.74rem;color:var(--muted)}
.copybtn{margin-left:auto;border:1px solid var(--border);background:var(--surface2);color:var(--fg-soft);border-radius:8px;padding:5px 10px;font-size:.74rem;cursor:pointer;flex:none}

/* ===== MODAL (avatar picker / viewer) ===== */
.modal-bg{position:fixed;inset:0;background:rgba(5,7,16,.72);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .2s both}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-xl);padding:24px;max-width:540px;width:100%;max-height:88dvh;overflow:auto;box-shadow:var(--shadow)}
.modal h3{font-size:1.3rem;margin-bottom:6px}
.modal .sub{color:var(--muted);font-size:.88rem;margin-bottom:16px}
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
.av-pick{aspect-ratio:1;border:2px solid var(--border);border-radius:var(--r);background:var(--surface2);cursor:pointer;display:grid;place-items:center;padding:8px;transition:transform .12s,border-color .12s}
.av-pick:hover{transform:translateY(-3px) scale(1.03)}
.av-pick.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--surface2))}
.av-pick svg{width:100%;height:100%}

/* ===== AVATAR ANIMATION ===== */
.av{display:inline-block}
.av svg{width:100%;height:100%;display:block;overflow:visible}
.av .bob{transform-box:fill-box;transform-origin:center;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
.av .blink{animation:blink 4.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.av .float2{animation:bob 3.3s ease-in-out infinite}

/* toast */
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:11px 16px;box-shadow:var(--shadow);font-weight:600;font-size:.88rem;display:flex;align-items:center;gap:9px;animation:pop .35s cubic-bezier(.22,1.3,.4,1) both}
.toast .tx{width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--brand) 22%,var(--surface2));color:var(--brand);display:grid;place-items:center;flex:none}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.lvlup{position:fixed;inset:0;z-index:210;display:grid;place-items:center;pointer-events:none}
.lvlup .card{background:linear-gradient(135deg,var(--brand),#ffd778);color:var(--brand-ink);padding:22px 34px;border-radius:var(--r-xl);font-family:var(--f-display);text-align:center;box-shadow:0 20px 60px -20px rgba(0,0,0,.6);animation:pop .5s cubic-bezier(.22,1.3,.4,1) both}
.lvlup .card b{font-size:1.8rem;display:block}

/* ===== COINS / TIENDA / EFECTOS ===== */
.shop-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:6px}
.coin-bal{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--coin) 16%,var(--surface2));color:var(--coin);border:1px solid color-mix(in srgb,var(--coin) 35%,transparent);border-radius:20px;padding:8px 16px;font-weight:800;font-family:var(--f-display);font-size:1.05rem}
.shop-sec{margin-top:26px}
.shop-sec h3{font-size:1.15rem;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.shop-sec>.shint{color:var(--muted);font-size:.86rem;margin:0 0 12px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:14px}
.shop-card{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px}
.shop-card .sv,.shop-card .sv .av{width:74px;height:74px}
.shop-card b{font-size:.94rem}
.shop-card .sdesc{font-size:.78rem;color:var(--muted);min-height:2.4em;line-height:1.35}
.shop-card .scost{display:inline-flex;align-items:center;gap:5px;color:var(--coin);font-weight:800;font-family:var(--f-display)}
.shop-card .ti-chip{font-family:var(--f-display);font-weight:700;font-size:1.02rem;padding:8px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border2)}
.shop-btn{width:100%}
.badge-owned{font-size:.72rem;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent);padding:5px 11px;border-radius:20px}
.badge-on{font-size:.72rem;font-weight:700;color:var(--brand);background:color-mix(in srgb,var(--brand) 18%,transparent);padding:5px 11px;border-radius:20px}

.av-pick.locked{opacity:.5}

<script>
/* ============ MÓDULO: REDES ============ */
(window.C8 = window.C8 || { modules: [] }).modules.push({
  id: 'redes', name: 'Redes', short: 'Redes', color: 'redes', glyph: 'net',
  tagline: 'Cómo viajan los datos: capas, IPs, subredes, puertos y protocolos.',
  why: 'Todo lo demás (ciberseguridad, Kali, bases de datos en la nube, APIs) corre sobre una red. Si entendés cómo viaja un paquete, entendés el 80% de los problemas reales.',
  glossary: [
    ['Paquete', 'Unidad de datos de la capa 3 (red). Lleva IP de origen y destino.'],
    ['Trama', 'Unidad de datos de la capa 2 (enlace). Lleva direcciones MAC.'],
    ['MAC', 'Dirección física de 48 bits grabada en la placa de red. Ej: 3C:52:82:1A:9F:04.'],
    ['Gateway', 'Puerta de enlace: el router al que tu equipo manda todo lo que no es de su red local.'],
    ['CIDR', 'Notación /n que indica cuántos bits de la IP son de red. /24 = 255.255.255.0.'],
    ['Puerto', 'Número de 16 bits (0-65535) que identifica a qué programa va un dato dentro de un equipo.'],
    ['DNS', 'Sistema que traduce nombres (utn.edu.ar) a direcciones IP.'],
    ['DHCP', 'Protocolo que asigna IP, máscara, gateway y DNS automáticamente.'],
    ['NAT', 'Traducción de direcciones: muchas IP privadas salen a Internet con una IP pública.'],
    ['Latencia', 'Tiempo que tarda un paquete en ir y volver. Se mide en ms con ping.'],
    ['TTL', 'Time To Live: contador que baja en cada router; evita que un paquete gire para siempre.'],
    ['ARP', 'Protocolo que averigua la MAC que corresponde a una IP dentro de la LAN.']
  ],
  lessons: [
  /* ---------------- r1 ---------------- */
  {
    id: 'r1', title: '¿Qué es una red y cómo se organiza?', level: 'Básico', mins: 12,
    goal: 'Vas a entender qué es una red, qué tipos existen y quién habla con quién. Sirve para ubicar cualquier problema: ¿es de mi LAN, de mi proveedor o del servidor?',
    body: [
      ['p', 'Una <b>red</b> es un conjunto de dispositivos (nodos) conectados por enlaces que comparten información siguiendo reglas comunes llamadas <b>protocolos</b>. Tu celular, la notebook, el router de tu casa y el servidor de Netflix son nodos; el Wi-Fi, el cable UTP y la fibra óptica son enlaces.'],
      ['tip', '<b>Analogía:</b> una red es como el correo postal. Las casas son los nodos, las calles son los enlaces, la dirección del sobre es la IP y el número de departamento es el puerto. El protocolo es el formato del sobre: si escribís la dirección en cualquier lado, el cartero no lo entrega.'],
      ['h', 'Tipos de red según su alcance'],
      ['table', ['Tipo', 'Alcance', 'Ejemplo real'], [
        ['PAN', 'Unos metros', 'Auriculares Bluetooth con tu celular'],
        ['LAN', 'Una casa, oficina o laboratorio', 'Todos los equipos del aula de la UTN'],
        ['MAN', 'Una ciudad', 'Red de fibra que une sedes de un municipio'],
        ['WAN', 'Países o continentes', 'Internet, la red de un banco con sucursales']
      ]],
      ['h', 'Topologías: la forma de la red'],
      ['diagram', 'topologies'],
      ['ul', [
        '<b>Estrella:</b> todos se conectan a un switch central. Es la más usada en LAN: si se corta un cable, cae un solo equipo; si cae el switch, cae todo.',
        '<b>Bus:</b> un único cable compartido. Histórica; un corte divide la red.',
        '<b>Anillo:</b> cada nodo pasa los datos al siguiente.',
        '<b>Malla:</b> muchos caminos alternativos. Así está armado el núcleo de Internet: si un enlace cae, el tráfico toma otra ruta.'
      ]],
      ['h', 'Modelos de comunicación'],
      ['p', 'En el modelo <b>cliente-servidor</b> un programa pide (cliente) y otro responde (servidor): tu navegador pide una página a un servidor web. En <b>P2P</b> (peer to peer) cada nodo es cliente y servidor a la vez, como en BitTorrent.'],
      ['h', 'Los dispositivos que vas a escuchar todo el tiempo'],
      ['table', ['Dispositivo', 'Qué hace', 'Capa OSI'], [
        ['Hub', 'Repite todo a todos los puertos (obsoleto)', '1'],
        ['Switch', 'Conecta equipos de la misma LAN usando direcciones MAC', '2'],
        ['Router', 'Conecta redes distintas y decide la ruta usando direcciones IP', '3'],
        ['Access point', 'Da acceso inalámbrico (Wi-Fi) a una LAN', '2'],
        ['Firewall', 'Filtra tráfico según reglas', '3 a 7']
      ]],
      ['key', 'El router de tu casa en realidad es un combo: router + switch + access point + firewall + servidor DHCP, todo en una caja.']
    ],
    tasks: [
      { t: 'mcq', q: 'Conectás 25 computadoras de un laboratorio dentro del mismo edificio. ¿Qué tipo de red armaste?', opts: ['PAN', 'LAN', 'MAN', 'WAN'], a: 1, hint: 'Pensá en el alcance físico: un edificio.', why: 'Una LAN cubre un área local como una casa, oficina o edificio. WAN implica distancias de ciudades o países.' },
      { t: 'mcq', q: 'En una topología estrella, ¿qué pasa si falla el switch central?', opts: ['Solo cae el equipo más cercano', 'Los equipos se reconectan en anillo automáticamente', 'Cae toda la comunicación entre equipos', 'No pasa nada, cada equipo tiene su propio cable'], a: 2, hint: '¿Por dónde pasan TODOS los datos en una estrella?', why: 'El nodo central es un punto único de falla: todos los mensajes pasan por él.' },
      { t: 'mcq', q: '¿Qué dispositivo necesitás para que tu LAN (192.168.0.x) se comunique con otra red distinta como Internet?', opts: ['Hub', 'Switch', 'Router', 'Repetidor'], a: 2, hint: 'Conectar redes DISTINTAS es trabajo de capa 3.', why: 'El router conecta redes diferentes y decide rutas usando direcciones IP. El switch solo conecta equipos de la misma red.' },
      { t: 'mcq', q: 'Tu navegador le pide una página a un servidor web y este se la devuelve. ¿Qué modelo es?', opts: ['P2P', 'Cliente-servidor', 'Malla', 'Broadcast'], a: 1, hint: 'Hay un rol que pide y otro que responde.', why: 'El navegador es el cliente que pide; el servidor web responde. En P2P ambos lados cumplen los dos roles.' },
      { t: 'mcq', q: 'Para conectar dos redes DISTINTAS (por ejemplo tu LAN con Internet) usás:', opts: ['un switch', 'un router', 'un hub', 'un cable cruzado'], a: 1, hint: '¿Qué equipo une redes diferentes?', why: 'El router interconecta redes distintas; el switch solo une equipos dentro de una misma red.' },
      { t: 'mcq', q: 'En una topología en ESTRELLA, si falla el nodo central:', opts: ['no pasa nada', 'se cae toda la red', 'solo se cae un equipo', 'mejora la velocidad'], a: 1, hint: 'El centro es un punto único de falla.', why: 'Todos los equipos pasan por el centro: si cae, se cae toda la red.' },
      { t: 'mcq', q: 'Una red que cubre grandes distancias (como Internet) es una:', opts: ['LAN', 'WAN', 'PAN', 'VPN'], a: 1, hint: 'W de "wide" (amplia).', why: 'WAN (Wide Area Network) cubre grandes distancias; la LAN es local.' },
      { t: 'mcq', q: 'El Wi-Fi de tu casa, respecto de la red cableada, es:', opts: ['una red totalmente distinta', 'otro medio de la MISMA LAN', 'siempre más seguro', 'una WAN'], a: 1, hint: 'Cambia el medio, no la red.', why: 'Cableado y Wi-Fi son dos medios de acceso a la misma LAN.' }
    ],
    recap: { remember: ['LAN = local, WAN = grandes distancias (Internet).', 'Switch une equipos de una red; router une redes distintas.', 'La estrella tiene un punto único de falla: el centro.'], pitfalls: ['Confundir switch con router.', 'Creer que el Wi-Fi es una red distinta: es otro medio de la misma LAN.'] }
  },
  /* ---------------- r2 ---------------- */
  {
    id: 'r2', title: 'Modelo OSI y TCP/IP: las capas', level: 'Básico', mins: 15,
    goal: 'Vas a aprender a pensar la red en capas. Es la herramienta mental número uno para diagnosticar: "¿el problema es de cable, de IP o de la aplicación?".',
    body: [
      ['p', 'Mandar un mensaje por Internet involucra muchísimas tareas: convertir bits en señales, encontrar el camino, reenviar lo perdido, cifrar. Para no mezclar todo, se divide el trabajo en <b>capas</b>. Cada capa resuelve un problema y le ofrece un servicio a la de arriba.'],
      ['diagram', 'osi'],
      ['table', ['#', 'Capa', 'Qué resuelve', 'PDU', 'Ejemplos'], [
        ['7', 'Aplicación', 'Lo que usa el programa', 'Datos', 'HTTP, DNS, SSH, SMTP'],
        ['6', 'Presentación', 'Formato, cifrado, compresión', 'Datos', 'TLS, JPEG, UTF-8'],
        ['5', 'Sesión', 'Abrir, mantener y cerrar diálogos', 'Datos', 'RPC, NetBIOS'],
        ['4', 'Transporte', 'Entrega entre programas (puertos), confiabilidad', 'Segmento', 'TCP, UDP'],
        ['3', 'Red', 'Direccionamiento lógico y rutas', 'Paquete', 'IP, ICMP, routers'],
        ['2', 'Enlace', 'Entrega dentro de la LAN', 'Trama', 'Ethernet, Wi-Fi, MAC, switches'],
        ['1', 'Física', 'Bits como señales', 'Bits', 'Cable UTP, fibra, radio']
      ]],
      ['tip', '<b>Truco para recordarlas</b> (de la 1 a la 7): <b>F</b>ísica, <b>E</b>nlace, <b>R</b>ed, <b>T</b>ransporte, <b>S</b>esión, <b>P</b>resentación, <b>A</b>plicación: "<b>F</b>ernando <b>E</b>s <b>R</b>ápido <b>T</b>omando <b>S</b>opa <b>P</b>ara <b>A</b>lmorzar".'],
      ['h', 'Encapsulación: la mamushka de datos'],
      ['p', 'Cuando enviás algo, cada capa le agrega su propio <b>encabezado</b> (header) a lo que recibió de arriba. Al llegar, el receptor hace el camino inverso y va quitando encabezados. Eso se llama <b>encapsulación</b> y <b>desencapsulación</b>.'],
      ['diagram', 'encap'],
      ['h', 'El modelo TCP/IP (el que se usa de verdad)'],
      ['p', 'OSI es un modelo de referencia para estudiar. Internet funciona con <b>TCP/IP</b>, que agrupa las capas en 4: <b>Acceso a red</b> (OSI 1-2), <b>Internet</b> (OSI 3), <b>Transporte</b> (OSI 4) y <b>Aplicación</b> (OSI 5-7).'],
      ['key', 'Diagnóstico de abajo hacia arriba: ¿está conectado el cable o el Wi-Fi? (1-2) → ¿tengo IP y llego al gateway? (3) → ¿responde el puerto? (4) → ¿la aplicación funciona? (7). En la jerga, "error de capa 8" es el usuario.']
    ],
    tasks: [
      { t: 'mcq', q: '¿En qué capa OSI trabaja un router?', opts: ['Capa 1 - Física', 'Capa 2 - Enlace', 'Capa 3 - Red', 'Capa 7 - Aplicación'], a: 2, hint: 'El router decide rutas usando direcciones IP.', why: 'El router lee la IP de destino del paquete y elige por dónde mandarlo: eso es capa 3.' },
      { t: 'order', q: 'Ordená la encapsulación desde que la aplicación genera los datos hasta que salen por el cable.', items: ['Datos', 'Segmento', 'Paquete', 'Trama', 'Bits'], hint: 'Vas de la capa 7 a la capa 1.', why: 'Aplicación genera datos → Transporte arma segmentos → Red arma paquetes → Enlace arma tramas → Física envía bits.' },
      { t: 'mcq', q: 'Un switch usa direcciones MAC para decidir a qué puerto mandar una trama. ¿En qué capa trabaja?', opts: ['Física', 'Enlace', 'Red', 'Transporte'], a: 1, why: 'Las direcciones MAC y las tramas son de la capa 2, Enlace de datos.' },
      { t: 'mcq', q: 'HTTPS cifra el contenido con TLS. En OSI, ¿qué capa se encarga del cifrado?', opts: ['Sesión', 'Presentación', 'Transporte', 'Red'], a: 1, hint: 'Formato, cifrado y compresión van juntos.', why: 'La capa de Presentación transforma los datos: codificación, compresión y cifrado. En TCP/IP todo esto queda dentro de "Aplicación".' },
      { t: 'mcq', q: 'Tenés Wi-Fi conectado pero no abre ninguna página. Hacés ping 8.8.8.8 y responde, pero ping google.com dice "host desconocido". ¿Dónde está el problema?', opts: ['Capa física: el Wi-Fi está mal', 'Capa de red: no tenés IP', 'En la resolución de nombres (DNS, capa aplicación)', 'El servidor de Google está caído'], a: 2, hint: 'Llegás a una IP de Internet. Lo que falla es traducir el nombre.', why: 'Si el ping a una IP pública responde, las capas 1 a 3 andan. Falla la traducción de nombre a IP: el DNS.' },
      { t: 'text', q: '¿Cuántas capas tiene el modelo OSI?', a: ['7', 'siete'], hint: 'De Física a Aplicación.', why: 'Son 7: Física, Enlace, Red, Transporte, Sesión, Presentación y Aplicación.' },
      { t: 'mcq', q: 'Un switch común (no administrable) trabaja en la capa:', opts: ['1 (Física)', '2 (Enlace)', '3 (Red)', '4 (Transporte)'], a: 1, hint: 'Usa direcciones MAC.', why: 'El switch conmuta por dirección MAC, que es de capa 2 (Enlace).' },
      { t: 'mcq', q: 'La PDU de la capa de Red (capa 3) se llama:', opts: ['trama', 'paquete', 'segmento', 'bit'], a: 1, hint: 'bits → trama → paquete → segmento → datos.', why: 'En capa 3 la unidad es el paquete; la trama es capa 2 y el segmento capa 4.' },
      { t: 'mcq', q: 'Para diagnosticar problemas de red conviene ir:', opts: ['de arriba (aplicación) hacia abajo', 'de abajo (física) hacia arriba', 'solo mirando la capa 7', 'al azar'], a: 1, hint: 'Primero: ¿hay cable/señal?', why: 'Se diagnostica de abajo hacia arriba: sin capa física no sirve revisar la aplicación.' }
    ],
    recap: { remember: ['7 capas: Física, Enlace, Red, Transporte, Sesión, Presentación, Aplicación.', 'PDU: bits → trama → paquete → segmento → datos.', 'Diagnosticá de abajo hacia arriba.'], pitfalls: ['Decir que el switch trabaja en capa 3 (los switches comunes son capa 2).', 'Confundir OSI (modelo teórico) con TCP/IP (implementación real).'] }
  },
  /* ---------------- r3 ---------------- */
  {
    id: 'r3', title: 'Binario y direcciones IPv4', level: 'Básico', mins: 18,
    goal: 'Vas a leer una IP como la lee la computadora: en binario. Sin esto, el subnetting es pura memoria; con esto, es aritmética simple.',
    body: [
      ['p', 'Una dirección IPv4 tiene <b>32 bits</b>, escritos como 4 números decimales de 0 a 255 separados por puntos (cada uno es un <b>octeto</b> de 8 bits). Ejemplo: {{192.168.1.10}}.'],
      ['h', 'Cómo pasar de decimal a binario'],
      ['p', 'Cada posición de un octeto vale una potencia de 2. Para convertir, recorrés de izquierda a derecha y te preguntás "¿entra este valor?". Si entra, ponés 1 y restás.'],
      ['table', ['Posición', '128', '64', '32', '16', '8', '4', '2', '1'], [
        ['192 =', '1', '1', '0', '0', '0', '0', '0', '0'],
        ['168 =', '1', '0', '1', '0', '1', '0', '0', '0'],
        ['10 =', '0', '0', '0', '0', '1', '0', '1', '0']
      ]],
      ['p', 'Ejemplo con 168: ¿entra 128? Sí → 1, quedan 40. ¿64? No → 0. ¿32? Sí → 1, quedan 8. ¿16? No. ¿8? Sí → 1, quedan 0. El resto, ceros: {{10101000}}.'],
      ['tool', 'binconv'],
      ['h', 'Parte de red y parte de host'],
      ['p', 'Una IP se divide en dos: la <b>parte de red</b> (identifica la red, como la calle) y la <b>parte de host</b> (identifica al equipo, como el número de casa). La <b>máscara</b> dice dónde está el corte. Con máscara {{255.255.255.0}} (/24), los primeros 24 bits son de red: {{192.168.1}} es la red y {{.10}} el host.'],
      ['h', 'IPs privadas y especiales'],
      ['table', ['Rango', 'Uso'], [
        ['10.0.0.0 /8', 'Privada (empresas grandes)'],
        ['172.16.0.0 – 172.31.255.255 /12', 'Privada'],
        ['192.168.0.0 /16', 'Privada (casas y oficinas)'],
        ['127.0.0.1', 'Loopback: tu propio equipo (localhost)'],
        ['169.254.x.x', 'APIPA: el equipo no consiguió IP por DHCP'],
        ['0.0.0.0', '"Cualquier dirección" o "ninguna", según el contexto'],
        ['255.255.255.255', 'Broadcast limitado: todos en la red local']
      ]],
      ['p', 'Las IP privadas no salen directo a Internet: tu router las traduce a tu IP pública mediante <b>NAT</b> (lo vemos más adelante).'],
      ['info', 'Las "clases" A, B y C (por el primer octeto) son históricas. Hoy se usa CIDR, pero todavía aparecen en exámenes: A = 1-126, B = 128-191, C = 192-223.'],
      ['h', 'IPv6 en una línea'],
      ['p', 'IPv4 permite unos 4.300 millones de direcciones y se agotaron. <b>IPv6</b> usa 128 bits en hexadecimal: {{2001:0db8:85a3::8a2e:0370:7334}}. Los ceros seguidos se abrevian con {{::}} una sola vez.']
    ],
    tasks: [
      { t: 'text', q: 'Convertí 200 a binario (8 bits).', a: ['11001000'], hint: '200 - 128 = 72. ¿Entra 64? Seguí restando.', why: '128 + 64 + 8 = 200 → 1 1 0 0 1 0 0 0.' },

"mati124"      -> SHA-256 -> 6e809cbda0732ac4845916a59016f954...`, { title: 'Un carácter de diferencia, hash totalmente distinto' }],
      ['p', 'Para verificar un login, el sistema hashea lo que escribís y lo compara con el hash guardado. Nunca necesita conocer tu contraseña real.'],
      ['h', 'Por qué un hash simple no alcanza'],
      ['ul', [
        'Hashes como MD5 o SHA-1 están <b>rotos</b> para contraseñas: son demasiado rápidos y permiten probar miles de millones por segundo.',
        'Si dos personas usan la misma contraseña, tienen el mismo hash: se nota en la base.',
        'Existen <b>tablas rainbow</b>: diccionarios precalculados de hash → contraseña.'

      ['h', 'La solución: salt + función lenta'],
      ['ul', [
        '<b>Salt:</b> un valor aleatorio único por usuario que se concatena a la contraseña antes de hashear. Así dos contraseñas iguales dan hashes distintos y las tablas rainbow dejan de servir.',
        '<b>Funciones de hashing para contraseñas:</b> bcrypt, scrypt o Argon2. Están diseñadas para ser <b>lentas</b> y consumir memoria, lo que hace inviable probar millones por segundo.'

      ['code', 'text', `Guardar:   salt = aleatorio()

      ['h', 'Autenticación multifactor (MFA)'],
      ['p', 'Combinar factores de distinto tipo hace mucho más difícil el acceso indebido:'],
      ['ul', ['<b>Algo que sabés:</b> contraseña, PIN.', '<b>Algo que tenés:</b> el celular con una app de códigos, una llave física.', '<b>Algo que sos:</b> huella, rostro.']],
      ['tip', 'Una buena contraseña hoy es <b>larga</b> (una frase de 4+ palabras) más que "complicada". "caballo-correcto-bateria-grapa" es más fuerte y más fácil de recordar que "P@ss1!". Usá un gestor de contraseñas y MFA donde puedas.']
    ],
    tasks: [
      { t: 'mcq', q: '¿Por qué bcrypt es mejor que SHA-256 para guardar contraseñas?', opts: ['Porque es reversible', 'Porque es deliberadamente lento y usa salt, dificultando probar millones por segundo', 'Porque ocupa menos espacio', 'Porque no necesita salt'], a: 1, why: 'bcrypt está diseñado para ser costoso en tiempo y memoria, lo opuesto a lo que querés en un hash general. Eso frena los ataques de fuerza bruta.' },
      { t: 'mcq', q: '¿Para qué sirve el salt?', opts: ['Para cifrar la contraseña de forma reversible', 'Para que dos contraseñas iguales produzcan hashes distintos y anular las tablas rainbow', 'Para acelerar el login', 'Para recordar la contraseña del usuario'], a: 1, why: 'El salt es único por usuario: aunque dos personas usen la misma clave, sus hashes difieren, y los diccionarios precalculados no sirven.' },
      { t: 'mcq', q: 'Te filtran la base de datos de un sistema que usa bcrypt con salt. ¿Qué es lo correcto decir?', opts: ['Todas las cuentas quedan comprometidas al instante', 'Las contraseñas no se revelan directamente, pero las débiles podrían caer con el tiempo; conviene forzar cambio de contraseña', 'No pasa nada, bcrypt es irrompible', 'Hay que cambiar el lenguaje de programación'], a: 1, why: 'bcrypt + salt no revela las contraseñas, pero las muy débiles pueden adivinarse offline. Lo correcto es notificar y forzar el cambio.' },
      { t: 'mcq', q: '¿Cuál es un ejemplo de autenticación de DOS factores reales?', opts: ['Contraseña + pregunta de seguridad', 'Contraseña + código de una app en tu celular', 'Usuario + contraseña', 'Huella + reconocimiento facial del mismo teléfono'], a: 1, hint: 'Los factores deben ser de TIPOS distintos: saber / tener / ser.', why: 'Contraseña (algo que sabés) + código del celular (algo que tenés) son factores de tipos distintos. Dos cosas que sabés no es verdadero MFA.' },
      { t: 'mcq', q: '¿Cómo se deben guardar las contraseñas en una base de datos?', opts: ['en texto plano', 'cifradas con MD5', 'con un hash lento + salt (bcrypt, scrypt o Argon2)', 'en un archivo .txt'], a: 2, hint: 'Hash lento y con sal.', why: 'Se usan hashes lentos y con salt (bcrypt/scrypt/Argon2); nunca texto plano ni MD5.' },
      { t: 'mcq', q: 'El "salt" en el hasheo de contraseñas sirve para:', opts: ['acelerar el login', 'que dos usuarios con la misma contraseña tengan hashes distintos', 'cifrar el disco', 'reemplazar el MFA'], a: 1, hint: 'Un valor único por usuario.', why: 'El salt único evita que contraseñas iguales produzcan el mismo hash y frena las rainbow tables.' },
      { t: 'mcq', q: 'Usar MD5 o SHA-1 para almacenar contraseñas es:', opts: ['la mejor opción', 'desaconsejado: son rápidos y ya vulnerables', 'imposible', 'solo para imágenes'], a: 1, hint: 'Demasiado rápidos.', why: 'Su velocidad facilita los ataques de fuerza bruta; para contraseñas se usan hashes diseñados para ser lentos.' },
      { t: 'mcq', q: 'El MFA es más fuerte cuando combina:', opts: ['dos contraseñas', 'factores de TIPOS distintos (algo que sabés + algo que tenés)', 'dos correos', 'la misma app dos veces'], a: 1, hint: 'Distintos tipos de factor.', why: 'Combinar categorías distintas (conocimiento + posesión + inherencia) es lo que da fuerza al MFA.' }
    ],
    recap: { remember: ['Contraseñas: nunca en texto plano.', 'Usá bcrypt/scrypt/Argon2 + salt único por usuario.', 'MFA = combinar factores de tipos distintos.'], pitfalls: ['Usar MD5 o SHA-1 para contraseñas.', 'Reusar la misma contraseña en varios sitios.'] }
  },

  {

    goal: 'Vas a distinguir hashing, cifrado simétrico y asimétrico, y entender qué protege HTTPS. Es la base para manejar datos sensibles sin meter la pata.',
    body: [

      ['h', 'Cifrado asimétrico: dos claves'],

      ['ul', [

      ['diagram', 'asim'],
      ['h', 'Cómo encaja en HTTPS/TLS'],
      ['ol', [

        'El <b>certificado</b> del servidor (firmado por una autoridad de confianza) prueba que el servidor es quien dice ser.',
        'A partir de ahí usan cifrado <b>simétrico</b> (rápido) con esa clave de sesión para todo el tráfico.'
      ]],
      ['tip', 'Lo mejor de los dos mundos: asimétrico para intercambiar la clave con seguridad, simétrico para la velocidad del resto de la comunicación.'],
      ['h', 'Firma e integridad'],
      ['p', 'Un <b>HMAC</b> combina un hash con una clave secreta para verificar a la vez integridad y autenticidad de un mensaje. Las <b>firmas digitales</b> hacen lo mismo con criptografía asimétrica y agregan no repudio.'],
      ['warn', 'Nunca inventes tu propio algoritmo de cifrado ("roll your own crypto"). Usá librerías probadas y estándares (AES-GCM, TLS 1.3, Argon2). La criptografía casera casi siempre tiene fallas sutiles.']
    ],
    tasks: [
      { t: 'mcq', q: 'Querés mandarle un mensaje secreto a Ana usando cifrado asimétrico. ¿Con qué clave lo ciframos?', opts: ['Con mi clave privada', 'Con la clave pública de Ana', 'Con mi clave pública', 'Con la clave privada de Ana'], a: 1, hint: 'Solo Ana debe poder abrirlo, y solo ella tiene su clave privada.', why: 'Se cifra con la pública de Ana; únicamente su clave privada puede descifrarlo. Así garantizás confidencialidad.' },
      { t: 'mcq', q: 'Querés que todos puedan verificar que un documento lo firmaste vos y no fue alterado. ¿Qué usás?', opts: ['Cifrás con la pública del lector', 'Firmás con tu clave privada', 'Hasheás sin clave y listo', 'Cifrás con AES'], a: 1, why: 'Firmar con tu clave privada permite que cualquiera verifique con tu pública que fuiste vos (autenticidad y no repudio) y que el contenido no cambió.' },
      { t: 'mcq', q: '¿Por qué HTTPS combina cifrado asimétrico y simétrico?', opts: ['Por capricho del estándar', 'Usa el asimétrico para acordar una clave con seguridad y el simétrico, más rápido, para el resto', 'Porque el simétrico no es seguro', 'Porque el asimétrico no existe en la práctica'], a: 1, why: 'El asimétrico es lento pero resuelve el intercambio de clave; el simétrico es veloz para el grueso del tráfico. Se usan juntos.' },

      { t: 'mcq', q: 'En criptografía asimétrica, para enviarte algo cifrado, el otro usa tu:', opts: ['clave privada', 'clave pública', 'contraseña', 'salt'], a: 1, hint: 'La que se puede repartir.', why: 'Cifran con tu clave pública y solo vos, con tu privada, podés descifrar.' },
      { t: 'mcq', q: 'Una firma digital se genera con:', opts: ['la clave pública', 'la clave privada del firmante', 'un hash sin clave', 'el salt'], a: 1, hint: 'Solo el dueño puede firmar.', why: 'Se firma con la clave privada; los demás verifican con la pública correspondiente.' },
      { t: 'mcq', q: 'HTTPS combina:', opts: ['solo cifrado simétrico', 'solo cifrado asimétrico', 'asimétrico para acordar la clave + simétrico para el tráfico', 'ningún cifrado'], a: 2, hint: 'Lo mejor de los dos mundos.', why: 'Usa asimétrico para intercambiar de forma segura una clave de sesión y luego simétrico (más rápido) para los datos.' }
    ],
    recap: { remember: ['Hash: sin clave, irreversible. Cifrado: con clave, reversible.', 'Asimétrico: pública para cifrar hacia alguien, privada para firmar.', 'HTTPS = asimétrico para la clave + simétrico para el tráfico.'], pitfalls: ['Inventar tu propio cifrado.', 'Confundir cifrar (reversible) con hashear (no reversible).'] }

  {

    goal: 'Vas a conocer las fallas web más comunes (OWASP Top 10) desde el lado del que las ARREGLA. Es lo que te van a pedir cuidar en cualquier trabajo de desarrollo.',
    body: [
      ['p', 'El <b>OWASP Top 10</b> es la lista de referencia de los riesgos web más críticos. Las vemos en clave defensiva: qué son y, sobre todo, cómo se previenen al programar.'],
      ['h', '1. Inyección (SQL Injection)'],
      ['p', 'Ocurre cuando datos del usuario se mezclan con una consulta como si fueran código. Ejemplo del problema (lo que NO hay que hacer):'],

    tasks: [
      { t: 'mcq', q: '¿Cuál es la defensa correcta contra la inyección SQL?', opts: ['Esconder los mensajes de error', 'Usar consultas parametrizadas (prepared statements)', 'Cambiar el nombre de las tablas', 'Usar MD5 en las contraseñas'], a: 1, why: 'Las consultas parametrizadas separan el código de los datos: la entrada del usuario nunca se interpreta como SQL.' },
      { t: 'mcq', q: 'Un usuario cambia /pedido/501 por /pedido/502 en la URL y ve el pedido de otra persona. ¿Qué falla es y cómo se arregla?', opts: ['XSS; escapando la salida', 'Control de acceso roto; verificando en el servidor que el recurso le pertenece', 'Inyección; usando parámetros', 'DoS; agregando más servidores'], a: 1, why: 'Es control de acceso roto. La solución es validar la propiedad del recurso en el servidor, en cada pedido, no ocultar el enlace.' },

      { t: 'mcq', q: 'Resumí la regla general que previene gran parte del OWASP Top 10.', opts: ['Confiar en que el frontend valida todo', 'Validar toda entrada y escapar toda salida, asumiendo que el dato externo es hostil', 'Ocultar el código fuente', 'Usar contraseñas largas'], a: 1, why: 'Nunca confiar en la entrada y escapar la salida según su contexto corta de raíz inyección, XSS y varias más.' },
      { t: 'mcq', q: '¿Cuál de estas prácticas reduce el riesgo de "componentes vulnerables"?', opts: ['No actualizar nunca para no romper nada', 'Mantener las librerías y dependencias actualizadas y revisadas', 'Usar solo código propio sin librerías', 'Desactivar el firewall'], a: 1, why: 'Las dependencias desactualizadas acumulan vulnerabilidades conocidas y con parche disponible. Actualizarlas y auditarlas es clave.' },
      { t: 'mcq', q: 'La forma correcta de prevenir inyección SQL es:', opts: ['revisar el input a ojo', 'usar consultas PARAMETRIZADAS (prepared statements)', 'esconder la base de datos', 'deshabilitar el login'], a: 1, hint: 'Separar datos de la instrucción.', why: 'Las consultas parametrizadas tratan la entrada como dato, no como parte del SQL, cortando la inyección de raíz.' },
      { t: 'mcq', q: 'El XSS (cross-site scripting) se mitiga principalmente:', opts: ['validando solo en el navegador', 'escapando la salida + aplicando una CSP', 'usando HTTP en vez de HTTPS', 'borrando cookies'], a: 1, hint: 'Escapar lo que se muestra.', why: 'Escapar la salida evita que el contenido se interprete como código, y la CSP agrega una capa extra.' },

      { t: 'text', q: 'Resolvé por Cramer el valor de x en: x + y = 5 ; x − y = 1.', a: ['3'], hint: 'x = det(Ax) / det(A).', why: 'det(A) = 1·(−1) − 1·1 = −2; det(Ax) = 5·(−1) − 1·1 = −6; x = −6 / −2 = 3.' },
      { t: 'mcq', q: 'Si det(A) = 0 y las ecuaciones se contradicen entre sí, el sistema es:', opts: ['compatible determinado', 'compatible indeterminado', 'incompatible', 'no se puede saber'], a: 2, hint: 'Sin solución posible.', why: 'det = 0 con ecuaciones contradictorias → no hay solución: sistema incompatible.' },
      { t: 'mcq', q: 'Un sistema de 3 ecuaciones con 3 incógnitas tiene det(A) ≠ 0. ¿Cuántas soluciones tiene?', opts: ['ninguna', 'infinitas', 'exactamente una', 'tres'], a: 2, hint: 'Regla de Cramer aplicable.', why: 'det(A) ≠ 0 garantiza solución única → compatible determinado.' }
    ],

  {
    id: 'pr6', title: 'Ordenamiento por burbujeo', level: 'Avanzado', mins: 20,
    goal: 'Vas a implementar el método de ordenamiento que se enseña primero y que cae en el parcial. Entender cómo "burbujea" el mayor te deja listo para trazarlo.',
    body: [
      ['p', 'El <b>ordenamiento por burbujeo (bubble sort)</b> compara elementos <b>vecinos</b> y los intercambia si están en el orden equivocado. En cada pasada completa, el elemento más grande "burbujea" hasta el final. Repitiendo las pasadas, el vector queda ordenado.'],
      ['h', 'El intercambio (swap)'],
      ['p', 'Para intercambiar dos valores hace falta una variable <b>auxiliar</b>, o se pierde uno:'],
      ['code', 'cpp', `int t = v[j];       // guardo el primero
v[j] = v[j+1];      // piso el primero con el segundo
v[j+1] = t;         // pongo el guardado en el segundo`, { title: 'Intercambio con variable auxiliar' }],
      ['h', 'El algoritmo completo'],
      ['code', 'cpp', `int v[5] = {5, 2, 8, 1, 9};
for (int i = 0; i < 5 - 1; i++)                 // pasadas
    for (int j = 0; j < 5 - 1 - i; j++)         // comparaciones vecinas
        if (v[j] > v[j+1]) {                     // si están desordenados
            int t = v[j]; v[j] = v[j+1]; v[j+1] = t;   // intercambiar
        }
for (int i = 0; i < 5; i++) cout << v[i] << " ";`, { out: '1 2 5 8 9 ' }],
      ['key', 'Dos detalles del burbujeo: el {{for}} interno va hasta {{n-1-i}} porque después de cada pasada el final ya está ordenado (no hace falta volver a tocarlo); y se hacen {{n-1}} pasadas como máximo.'],
      ['h', 'Trazar una sola pasada'],

// resultado tras UNA pasada:`, { out: '1 3 1 4 5 ' }],
      ['info', 'El burbujeo es simple de entender pero lento (O(n²)): para n grande hace muchísimas comparaciones. Por eso en la práctica se usan métodos más rápidos (como el {{sort}} de la STL que viste en C++), pero burbujear es el primer paso para entender cómo se ordena.']
    ],
    tasks: [
      { t: 'predict', q: 'Dado v = {4, 2, 7, 1}, ¿cómo queda el vector después de UNA sola pasada de burbujeo (comparando vecinos e intercambiando el mayor)?', lang: 'cpp', code: '#include <iostream>\nusing namespace std;\nint main(){\n    int v[4] = {4, 2, 7, 1};\n    for(int j=0;j<3;j++)\n        if(v[j]>v[j+1]){ int t=v[j]; v[j]=v[j+1]; v[j+1]=t; }\n    for(int i=0;i<4;i++) cout << v[i] << " ";\n    cout << endl;\n    return 0;\n}', a: ['2 4 1 7'], hint: 'Seguí paso a paso: 4>2 swap, 4>7 no, 7>1 swap. El 7 termina al final.', why: 'j=0: 4>2 swap→{2,4,7,1}. j=1: 4>7 no. j=2: 7>1 swap→{2,4,1,7}. El mayor (7) burbujeó al final.' },
      { t: 'mcq', q: '¿Por qué hace falta una variable auxiliar para intercambiar dos elementos?', opts: ['Por elegancia', 'Porque sin ella, al pisar el primero con el segundo se pierde el valor original', 'Para que sea más rápido', 'No hace falta'], a: 1, why: 'Si hacés v[j]=v[j+1] primero, el valor de v[j] se pierde. La auxiliar lo guarda antes de pisarlo.' },
      { t: 'mcq', q: 'Después de UNA pasada completa de burbujeo, ¿qué garantiza el algoritmo?', opts: ['Que todo el vector queda ordenado', 'Que el elemento más grande quedó en su posición final (al final)', 'Que el menor quedó primero', 'Nada'], a: 1, why: 'Cada pasada lleva el mayor restante al final. Hacen falta hasta n-1 pasadas para ordenar todo.' },
      { t: 'bug', q: 'Este intercambio está mal: pierde un valor porque le falta la variable auxiliar. El código correcto usa una variable t. Escribí la primera línea que falta (la que guarda v[j]).', lang: 'cpp', code: '// intercambiar v[j] y v[j+1]\nv[j] = v[j+1];\nv[j+1] = v[j];   // esto ya no sirve: v[j] fue pisado', fix: 'aux', accept: ['int t = v[j]', 'int t=v[j]'], hint: 'Antes de pisar v[j], hay que guardarlo en una auxiliar.', why: 'Falta int t = v[j]; al principio, y luego v[j]=v[j+1]; v[j+1]=t;. Sin guardar v[j] primero, se pierde.' },
      { t: 'predict', q: '¿Qué imprime (primer y último elemento ya ordenado)?', code: '#include <iostream>\nusing namespace std;\nint main(){\n    int v[4] = {5, 2, 8, 1};\n    for(int i = 0; i < 3; i++)\n        for(int j = 0; j < 3 - i; j++)\n            if(v[j] > v[j+1]) { int t = v[j]; v[j] = v[j+1]; v[j+1] = t; }\n    cout << v[0] << " " << v[3] << endl;\n    return 0;\n}', a: ['1 8'], hint: 'El burbujeo deja el vector ordenado de menor a mayor.', why: 'Ordenado queda {1,2,5,8}: v[0]=1 y v[3]=8.' },
      { t: 'mcq', q: 'Para intercambiar dos valores en el burbujeo necesitás:', opts: ['nada', 'una variable auxiliar', 'dos vectores', 'un struct'], a: 1, hint: 'Si pisás uno, perdés el otro.', why: 'La variable auxiliar guarda un valor mientras se sobrescribe, evitando perderlo en el intercambio.' },
      { t: 'mcq', q: 'En el burbujeo, tras la primera pasada completa, queda en su lugar definitivo:', opts: ['el menor al principio', 'el mayor al final', 'el del medio', 'ninguno'], a: 1, hint: 'Los mayores "burbujean" hacia el final.', why: 'Cada pasada empuja el mayor de los no ordenados hasta el final; por eso el interno llega hasta n−1−i.' },
      { t: 'mcq', q: 'La complejidad del ordenamiento burbuja es:', opts: ['O(1)', 'O(n)', 'O(n²)', 'O(log n)'], a: 2, hint: 'Dos bucles anidados sobre n.', why: 'Compara del orden de n·n pares → O(n²).' },
      { t: 'predict', q: '¿Qué imprime (elemento del medio ya ordenado)?', code: '#include <iostream>\nusing namespace std;\nint main(){\n    int v[5] = {5, 1, 4, 2, 3};\n    for(int i=0;i<4;i++)\n        for(int j=0;j<4-i;j++)\n            if(v[j] > v[j+1]){ int t=v[j]; v[j]=v[j+1]; v[j+1]=t; }\n    cout << v[2] << endl;\n    return 0;\n}', a: ['3'], hint: 'Ordenado de menor a mayor.', why: 'Queda {1,2,3,4,5}; el del medio (v[2]) es 3.' },
      { t: 'predict', q: '¿Qué imprime? (ordena al revés: intercambia si v[j] < v[j+1])', code: '#include <iostream>\nusing namespace std;\nint main(){\n    int v[4] = {3, 7, 1, 9};\n    for(int i=0;i<3;i++)\n        for(int j=0;j<3-i;j++)\n            if(v[j] < v[j+1]){ int t=v[j]; v[j]=v[j+1]; v[j+1]=t; }\n    cout << v[0] << endl;\n    return 0;\n}', a: ['9'], hint: 'La comparación invertida ordena de mayor a menor.', why: 'Con < queda descendente {9,7,3,1}; v[0] = 9.' },
      { t: 'mcq', q: '¿Cuántas pasadas completas necesita el burbujeo para n elementos (peor caso)?', opts: ['1', 'n − 1', 'n²', 'log n'], a: 1, hint: 'Cada pasada fija un elemento.', why: 'Hacen falta n−1 pasadas; el total de comparaciones es del orden de n² (su complejidad).' }
    ],
    recap: { remember: ['Burbujeo: compara vecinos e intercambia; el mayor sube al final.', 'Intercambio necesita variable auxiliar.', 'Interno hasta n-1-i; n-1 pasadas; es O(n²).'], pitfalls: ['Intercambiar sin variable auxiliar (se pierde un valor).', 'Creer que una sola pasada ordena todo.'] }
  },
  /* ---- pr7 ---- */
  {
    id: 'pr7', title: 'Apareo de vectores ordenados', level: 'Avanzado', mins: 20,
    goal: 'Vas a combinar dos vectores ya ordenados en uno solo ordenado, sin volver a ordenar. Es la base del corte de control y del procesamiento de archivos (Unidad 9).',
    body: [
      ['p', 'El <b>apareo (merge)</b> toma dos vectores <b>ya ordenados</b> A (n elementos) y B (m elementos) y genera un tercer vector C, también ordenado, con todos los elementos. Se usan <b>tres índices</b>: {{i}} para A, {{j}} para B y {{k}} para C.'],
      ['ol', [
        'Mientras ninguno se agotó ({{i < n && j < m}}): comparar {{A[i]}} con {{B[j]}}, copiar el <b>menor</b> a C y avanzar el índice de ese vector (y k).',
        'Cuando uno se agota, copiar el <b>resto</b> del otro: como ya está ordenado, va directo al final.'
      ]],
      ['code', 'cpp', `int apareo(int a[], int n, int b[], int m, int c[]) {
    int i = 0, j = 0, k = 0;
    while (i < n && j < m) {
        if (a[i] <= b[j]) c[k++] = a[i++];   // copia y avanza
        else              c[k++] = b[j++];
    }
    while (i < n) c[k++] = a[i++];    // resto de A
    while (j < m) c[k++] = b[j++];    // resto de B
    return k;                         // tamaño de C (= n + m)
}`, { note: 'Con A={2,5,9,14} y B={3,5,6,20,25}, C queda: 2 3 5 5 6 9 14 20 25' }],
      ['key', 'Dos claves: {{c[k++] = a[i++]}} copia y después avanza; y con {{<=}} ante un empate se toma primero el de A (el apareo es <b>estable</b>). Solo uno de los dos bucles del resto hace algo (el otro vector ya se agotó).'],
      ['warn', 'Errores típicos: olvidar los dos bucles del resto (se pierden elementos); usar {{||}} en vez de {{&&}} en la condición principal (se sale de los límites de un vector); aparear vectores que no están ordenados; o no avanzar un índice (bucle infinito).'],
      ['h', 'Costo y variantes'],
      ['p', 'El apareo cuesta {{n + m}} pasos, muchísimo menos que concatenar y ordenar con burbuja (del orden de {{(n+m)²}}). Variantes que se piden: <b>unión sin repetidos</b> (si {{A[i]==B[j]}}, copiar uno solo y avanzar los dos), <b>intersección</b> (copiar solo cuando son iguales), y <b>apareo de registros</b> (comparar por el campo clave: {{a[i].legajo <= b[j].legajo}}).']
