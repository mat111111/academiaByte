<title>Academia Byte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ===== LAYOUT: panel lateral + contenido; en móvil barra inferior ===== */
/* ===== DESIGN TOKENS ===== */
:root{
  --bg:#0e1020; --bg2:#141730; --surface:#1a1e3a; --surface2:#232a4d; --surface3:#2d3561;
  --fg:#eef1fb; --fg-soft:#c7cde8; --muted:#8c93b8; --faint:#616a94;
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.15);
  --brand:#f6c445; --brand-ink:#3a2c05;
  --redes:#2dd4bf; --ciber:#fb6a73; --sql:#5b9cff; --python:#ffcb47; --cpp:#b78bff; --juegos:#ff74c4; --ranking:#f6c445; --contacto:#57d98a;
  --matematica:#ff9d52; --programacion:#8fd14f; --ayso:#7d8cf5; --organizacion:#e06b9c;
  --ok:#4ade80; --bad:#fb6a73; --warn:#fbbf4d; --info:#5b9cff;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); --shadow-sm:0 4px 14px -6px rgba(0,0,0,.5);
  --r-sm:9px; --r:14px; --r-lg:22px; --r-xl:30px;
  --f-display:"Fredoka",system-ui,sans-serif; --f-body:"Figtree",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --maxw:1040px; --rail:248px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef0f8; --bg2:#e6e9f5; --surface:#ffffff; --surface2:#f3f5fb; --surface3:#e9edf8;
  --fg:#181c33; --fg-soft:#2f3659; --muted:#5a6185; --faint:#8b92b4;
  --border:rgba(20,24,55,.1); --border2:rgba(20,24,55,.18);
  --brand:#e0a512; --brand-ink:#fff;
  --redes:#0d9488; --ciber:#e23744; --sql:#2f6ef0; --python:#c48a06; --cpp:#7c47e0; --juegos:#d6338f; --ranking:#d99a0c; --contacto:#1f9d57;
  --matematica:#d9772e; --programacion:#5a9e26; --ayso:#4f5fd0; --organizacion:#c23a72;
  --shadow:0 12px 30px -14px rgba(40,50,90,.35); --shadow-sm:0 4px 14px -8px rgba(40,50,90,.3);
  color-scheme:light;
}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){
  --bg:#eef0f8; --bg2:#e6e9f5; --surface:#ffffff; --surface2:#f3f5fb; --surface3:#e9edf8;
  --fg:#181c33; --fg-soft:#2f3659; --muted:#5a6185; --faint:#8b92b4;
  --border:rgba(20,24,55,.1); --border2:rgba(20,24,55,.18);
  --brand:#e0a512; --brand-ink:#fff;
  --redes:#0d9488; --ciber:#e23744; --sql:#2f6ef0; --python:#c48a06; --cpp:#7c47e0; --juegos:#d6338f; --ranking:#d99a0c; --contacto:#1f9d57;
  --matematica:#d9772e; --programacion:#5a9e26; --ayso:#4f5fd0; --organizacion:#c23a72;
  --shadow:0 12px 30px -14px rgba(40,50,90,.35); --shadow-sm:0 4px 14px -8px rgba(40,50,90,.3);
  color-scheme:light;
}}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.modal-open{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--sql)}
button{font-family:inherit}
::selection{background:var(--brand);color:var(--brand-ink)}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ambient background */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 500px at 15% -5%,color-mix(in srgb,var(--sql) 16%,transparent),transparent 60%),
             radial-gradient(800px 600px at 100% 0%,color-mix(in srgb,var(--juegos) 13%,transparent),transparent 55%),
             radial-gradient(700px 600px at 50% 110%,color-mix(in srgb,var(--redes) 12%,transparent),transparent 60%);}

/* ===== APP SHELL ===== */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100%;}
/* side rail */
.rail{position:sticky;top:env(safe-area-inset-top,0);align-self:start;height:100dvh;
  padding:18px 14px calc(18px + env(safe-area-inset-bottom,0)) max(14px,env(safe-area-inset-left,0));
  display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--border);
  background:linear-gradient(180deg,var(--bg2),var(--bg));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;text-decoration:none;color:var(--fg)}
.brand-logo{width:38px;height:38px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:1.18rem;letter-spacing:-.02em;line-height:1}
.brand-sub{font-size:.66rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r);border:none;background:transparent;color:var(--fg-soft);
  cursor:pointer;text-align:left;font-size:.92rem;font-weight:500;width:100%;transition:background .15s,color .15s;position:relative}
.nav-i:hover{background:var(--surface)}
.nav-i .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--muted)) 22%,transparent)}
.nav-i.active{background:var(--surface2);color:var(--fg);font-weight:600}
.nav-i.active::before{content:"";position:absolute;left:-14px;top:14%;bottom:14%;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--brand))}
.rail-foot{margin-top:auto;padding-top:12px}

/* viewer chip */
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);cursor:pointer;width:100%;text-align:left}
.me:hover{border-color:var(--border2)}
.me .av{width:40px;height:40px;flex:none}
.me-name{font-weight:600;font-size:.86rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-lvl{font-size:.7rem;color:var(--muted)}
.xpbar{height:5px;border-radius:5px;background:var(--surface3);overflow:hidden;margin-top:5px}
.xpbar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--brand),#ffe08a);transition:width .6s cubic-bezier(.22,1,.36,1)}

/* content */
.main{min-width:0;padding:0 0 80px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0));padding-right:max(20px,env(safe-area-inset-right,0))}
.topbar{position:sticky;top:env(safe-area-inset-top,0);z-index:20;backdrop-filter:blur(12px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--border)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0);z-index:30;background:var(--bg)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
.crumb{font-family:var(--f-display);font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:9px;min-width:0}
.crumb .pill{font-size:.68rem;padding:3px 9px;border-radius:20px;font-weight:700;font-family:var(--f-body);letter-spacing:.03em;flex:none}
.top-sp{flex:1}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--fg-soft);cursor:pointer;display:grid;place-items:center;flex:none}
.icon-btn:hover{border-color:var(--border2);color:var(--fg)}

/* ===== BUTTONS ===== */
.btn{appearance:none;border:1px solid var(--border2);background:var(--surface2);color:var(--fg);font-weight:600;font-size:.9rem;
  padding:10px 16px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .08s,filter .15s,background .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--brand),#ffd778);color:var(--brand-ink);border-color:transparent}
.btn-ghost{background:transparent}
.btn-sm{padding:7px 12px;font-size:.82rem;border-radius:10px}
.btn-c{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,transparent);color:var(--fg)}

/* ===== HERO / HOME ===== */
.hero{padding:34px 0 10px}
.hero h1{font-size:clamp(1.9rem,5vw,3rem);font-weight:700;letter-spacing:-.025em}
.hero .lead{color:var(--fg-soft);font-size:clamp(1rem,2vw,1.18rem);max-width:60ch;margin-top:12px}
.hero .accent{background:linear-gradient(120deg,var(--brand),var(--juegos));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;min-width:120px}
.stat b{font-family:var(--f-display);font-size:1.5rem;display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}

/* module cards grid */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:16px;margin-top:10px}
.mod-card{position:relative;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-lg);padding:20px;cursor:pointer;overflow:hidden;transition:transform .14s,border-color .14s,box-shadow .14s}
.mod-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:var(--shadow)}
.mod-card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c)}
.mod-ic{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;margin-bottom:14px;
  background:color-mix(in srgb,var(--c) 20%,var(--surface2));color:var(--c)}
.mod-card h3{font-size:1.22rem;margin-bottom:5px}
.mod-card p{color:var(--muted);font-size:.86rem;margin:0}
.mod-meta{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.76rem;color:var(--faint);font-weight:600}
.mod-prog{height:6px;border-radius:6px;background:var(--surface3);overflow:hidden;margin-top:12px}
.mod-prog > i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .6s}

/* ===== SECTION / CONTENT ===== */
section.view{padding-top:22px;animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lead-row{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.sec-head{margin-bottom:6px}
.sec-head h2{font-size:clamp(1.5rem,3.4vw,2.1rem);letter-spacing:-.02em}
.sec-head p{color:var(--fg-soft);margin-top:8px;max-width:65ch}
.why{border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface));padding:12px 16px;border-radius:0 var(--r) var(--r) 0;margin:16px 0;font-size:.92rem;color:var(--fg-soft)}
.why b{color:var(--fg)}

/* lesson list */
.lessons{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.lesson-card{display:flex;align-items:center;gap:14px;padding:15px 17px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-lg);cursor:pointer;transition:border-color .14s,transform .1s;text-align:left;width:100%}
.lesson-card:hover{border-color:color-mix(in srgb,var(--c) 50%,transparent);transform:translateX(3px)}
.lesson-n{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem;background:color-mix(in srgb,var(--c) 16%,var(--surface2));color:var(--c)}
.lesson-card.done .lesson-n{background:var(--ok);color:#06220f}
.lesson-info{min-width:0;flex:1}
.lesson-info h4{font-size:1.02rem}
.lesson-info .meta{font-size:.76rem;color:var(--muted);display:flex;gap:10px;margin-top:3px;flex-wrap:wrap}
.lvl-badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.02em}
.lvl-Básico{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.lvl-Intermedio{background:color-mix(in srgb,var(--warn) 24%,transparent);color:var(--warn)}
.lvl-Avanzado{background:color-mix(in srgb,var(--ciber) 24%,transparent);color:var(--ciber)}

/* lesson body */
.article{max-width:72ch}
.article > *{margin-top:15px}
.article h3{font-size:1.28rem;margin-top:30px;color:var(--fg)}
.article h3::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:9px;vertical-align:middle}
.article p{color:var(--fg-soft)}
.article b{color:var(--fg);font-weight:700}
.article ul,.article ol{color:var(--fg-soft);padding-left:22px;display:flex;flex-direction:column;gap:7px}
.article li{padding-left:3px}
.article code,.ic{font-family:var(--f-mono);font-size:.86em;background:var(--surface2);padding:1.5px 6px;border-radius:6px;color:var(--fg);border:1px solid var(--border)}
.callout{padding:13px 16px;border-radius:var(--r);font-size:.9rem;display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border)}
.callout .ci{flex:none;margin-top:1px}
.callout.tip{background:color-mix(in srgb,var(--ok) 11%,var(--surface));border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.callout.warn{background:color-mix(in srgb,var(--warn) 11%,var(--surface));border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.callout.info{background:color-mix(in srgb,var(--info) 11%,var(--surface));border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.callout.key{background:color-mix(in srgb,var(--c) 12%,var(--surface));border-color:color-mix(in srgb,var(--c) 34%,transparent)}
.callout b{color:var(--fg)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);max-width:100%}
table.d{border-collapse:collapse;width:100%;font-size:.86rem;min-width:360px}
table.d th,table.d td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
table.d th{background:var(--surface2);font-weight:700;font-family:var(--f-display);color:var(--fg);white-space:nowrap;font-size:.82rem}
table.d tr:last-child td{border-bottom:none}
table.d td:first-child{font-weight:600;color:var(--fg)}
table.d tbody tr:hover{background:var(--surface2)}

/* code blocks */
.code{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:#0b0d1c;margin-top:16px}
:root[data-theme="light"] .code{background:#1a1e36}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .code{background:#1a1e36}}
.code-top{display:flex;align-items:center;gap:8px;padding:8px 13px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--border)}
.code-dots{display:flex;gap:5px}.code-dots i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.code-dots i:nth-child(2){background:#febc2e}.code-dots i:nth-child(3){background:#28c840}
.code-title{font-size:.74rem;color:#9aa3c8;font-family:var(--f-mono);margin-left:4px}
.code-copy{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.15);color:#c7cde8;font-size:.72rem;padding:3px 9px;border-radius:7px;cursor:pointer}
.code-copy:hover{background:rgba(255,255,255,.08)}
pre.src{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--f-mono);font-size:.82rem;line-height:1.6;color:#e6eafc}
pre.src .cm{color:#6b7394;font-style:italic}
pre.src .kw{color:#ff9ec4}
pre.src .st{color:#a6e3a1}
pre.src .nu{color:#f6c445}
pre.src .fn{color:#7fd6ff}
.code-out{border-top:1px dashed var(--border);padding:10px 16px;font-family:var(--f-mono);font-size:.8rem;color:#9fe6b0;white-space:pre-wrap}
.code-out .lbl{color:#6b7394;display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.run-row{display:flex;gap:8px;padding:9px 13px;border-top:1px solid var(--border);background:rgba(255,255,255,.02)}

/* diagrams */
.diagram{margin-top:16px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:14px;overflow-x:auto}
.diagram svg{display:block;margin:0 auto;max-width:100%;height:auto}

/* ===== EXERCISES ===== */
.ex{border:1px solid var(--border2);background:var(--surface);border-radius:var(--r-lg);padding:18px;margin-top:16px}
.ex-tag{font-size:.68rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--c);display:inline-flex;align-items:center;gap:6px;margin-bottom:9px}
.ex-q{font-weight:600;font-size:1.02rem;margin-bottom:14px}
.ex-q .ic{font-weight:500}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--surface2);cursor:pointer;text-align:left;font-size:.92rem;transition:border-color .12s,background .12s;width:100%;color:var(--fg)}
.opt:hover{border-color:var(--border2)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--surface3);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none;font-family:var(--f-display)}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface2))}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface2))}
.opt.correct .k{background:var(--ok);color:#06220f}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--surface2))}
.opt.wrong .k{background:var(--bad);color:#2a0608}
.opt[disabled]{cursor:default}
.ex-input{width:100%;padding:11px 14px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--bg2);color:var(--fg);font-family:var(--f-mono);font-size:.92rem}
.ex-input:focus{border-color:var(--c);outline:none}
.ex-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center}
.verdict{margin-top:14px;padding:13px 15px;border-radius:var(--r);font-size:.9rem;display:none;animation:fade .3s both}
.verdict.show{display:block}
.verdict.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.verdict.no{background:color-mix(in srgb,var(--bad) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 38%,transparent)}
.verdict .vh{font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:4px;font-family:var(--f-display)}
.verdict.ok .vh{color:var(--ok)}.verdict.no .vh{color:var(--bad)}
.verdict .xpget{color:var(--brand);font-weight:700}

/* code editor exercise */
.editor{border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;background:#0b0d1c;margin-bottom:10px}
:root[data-theme="light"] .editor{background:#161a30}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .editor{background:#161a30}}
.editor textarea{width:100%;border:none;background:transparent;color:#e6eafc;font-family:var(--f-mono);font-size:.84rem;line-height:1.6;padding:14px 16px;resize:vertical;min-height:120px;outline:none;tab-size:4}
.editor .ed-top{display:flex;align-items:center;padding:7px 12px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--border);font-family:var(--f-mono);font-size:.72rem;color:#9aa3c8;gap:8px}
.console{font-family:var(--f-mono);font-size:.8rem;background:#070912;border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;white-space:pre-wrap;color:#cdd4f0;max-height:220px;overflow:auto;margin-top:4px}
.console .ok{color:#9fe6b0}.console .err{color:#ff9 aa;color:#ff9eb0}.console .dim{color:#6b7394}

/* Parsons (ordenar) */
.parsons{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.parsons .pz{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1.5px solid var(--border2);border-radius:10px;background:var(--surface2);cursor:grab;font-family:var(--f-mono);font-size:.84rem;user-select:none}
.parsons .pz:active{cursor:grabbing}
.parsons .pz.drag{opacity:.4}
.parsons .pz.over{border-color:var(--c)}
.parsons .pz .h{color:var(--faint);font-size:1rem;flex:none}
.parsons .pz .mv{margin-left:auto;display:flex;gap:3px}

      ['h', 'Cifrado asimétrico: dos claves'],

      ['diagram', 'asim'],
      ['h', 'Cómo encaja en HTTPS/TLS'],
      ['ol', [
        'El cliente y el servidor usan cifrado <b>asimétrico</b> solo para ponerse de acuerdo en una clave de sesión de forma segura.',

        'A partir de ahí usan cifrado <b>simétrico</b> (rápido) con esa clave de sesión para todo el tráfico.'
      ]],
      ['tip', 'Lo mejor de los dos mundos: asimétrico para intercambiar la clave con seguridad, simétrico para la velocidad del resto de la comunicación.'],
      ['h', 'Firma e integridad'],
      ['p', 'Un <b>HMAC</b> combina un hash con una clave secreta para verificar a la vez integridad y autenticidad de un mensaje. Las <b>firmas digitales</b> hacen lo mismo con criptografía asimétrica y agregan no repudio.'],
      ['warn', 'Nunca inventes tu propio algoritmo de cifrado ("roll your own crypto"). Usá librerías probadas y estándares (AES-GCM, TLS 1.3, Argon2). La criptografía casera casi siempre tiene fallas sutiles.']

    tasks: [
      { t: 'mcq', q: 'Querés mandarle un mensaje secreto a Ana usando cifrado asimétrico. ¿Con qué clave lo ciframos?', opts: ['Con mi clave privada', 'Con la clave pública de Ana', 'Con mi clave pública', 'Con la clave privada de Ana'], a: 1, hint: 'Solo Ana debe poder abrirlo, y solo ella tiene su clave privada.', why: 'Se cifra con la pública de Ana; únicamente su clave privada puede descifrarlo. Así garantizás confidencialidad.' },
      { t: 'mcq', q: 'Querés que todos puedan verificar que un documento lo firmaste vos y no fue alterado. ¿Qué usás?', opts: ['Cifrás con la pública del lector', 'Firmás con tu clave privada', 'Hasheás sin clave y listo', 'Cifrás con AES'], a: 1, why: 'Firmar con tu clave privada permite que cualquiera verifique con tu pública que fuiste vos (autenticidad y no repudio) y que el contenido no cambió.' },
      { t: 'mcq', q: '¿Por qué HTTPS combina cifrado asimétrico y simétrico?', opts: ['Por capricho del estándar', 'Usa el asimétrico para acordar una clave con seguridad y el simétrico, más rápido, para el resto', 'Porque el simétrico no es seguro', 'Porque el asimétrico no existe en la práctica'], a: 1, why: 'El asimétrico es lento pero resuelve el intercambio de clave; el simétrico es veloz para el grueso del tráfico. Se usan juntos.' },

      { t: 'mcq', q: '¿Cuál es la defensa correcta contra la inyección SQL?', opts: ['Esconder los mensajes de error', 'Usar consultas parametrizadas (prepared statements)', 'Cambiar el nombre de las tablas', 'Usar MD5 en las contraseñas'], a: 1, why: 'Las consultas parametrizadas separan el código de los datos: la entrada del usuario nunca se interpreta como SQL.' },

    int i = 0, j = 0, k = 0;
    while (i < n && j < m) {
        if (a[i] <= b[j]) c[k++] = a[i++];   // copia y avanza
        else              c[k++] = b[j++];
    }
    while (i < n) c[k++] = a[i++];    // resto de A
    while (j < m) c[k++] = b[j++];    // resto de B
    return k;                         // tamaño de C (= n + m)
}`, { note: 'Con A={2,5,9,14} y B={3,5,6,20,25}, C queda: 2 3 5 5 6 9 14 20 25' }],

        sub += v[i].monto;
        i++;
    }
    cout << "Clave " << actual << ": " << sub << endl;   // CORTE: subtotal

}

        sub = 0;

}

  /* ---- a3 ---- */
  {
    id: 'a3', title: 'Hilos (threads)', level: 'Intermedio', mins: 16,
    goal: 'Vas a distinguir hilos de procesos y entender por qué un programa moderno usa varios hilos. Es la base de la concurrencia que viene después.',
    body: [
      ['p', 'Un <b>hilo (thread)</b> es una unidad de ejecución <b>dentro</b> de un proceso. Un proceso puede tener uno (monohilo) o muchos hilos (multihilo). Todos los hilos de un proceso <b>comparten</b> el mismo espacio de memoria, código y archivos abiertos, pero cada uno tiene su propio <b>contador de programa, registros y pila</b>.'],
      ['tip', '<b>Analogía:</b> el proceso es una cocina (con su heladera, mesada y utensilios compartidos). Los hilos son varios cocineros trabajando en esa misma cocina a la vez. Comparten los recursos, pero cada uno hace su tarea.'],
      ['h', 'Proceso vs. hilo'],
      ['table', ['', 'Procesos distintos', 'Hilos del mismo proceso'], [
        ['Memoria', 'Separada (aislada)', 'Compartida'],
        ['Comunicación', 'Compleja (mecanismos del SO)', 'Simple (variables compartidas)'],
        ['Creación', 'Más costosa', 'Más liviana y rápida'],
        ['Si uno falla', 'No afecta a los otros', 'Puede tirar todo el proceso']
      ]],
      ['h', '¿Para qué sirve el multihilo?'],
      ['ul', [
        '<b>Capacidad de respuesta:</b> un hilo atiende la interfaz mientras otro hace un cálculo pesado; la app no se "congela".',
        '<b>Paralelismo real:</b> en un procesador con varios núcleos, los hilos pueden correr <b>a la vez</b>, acelerando el trabajo.',
        '<b>Compartir recursos:</b> al compartir memoria, cooperan sin el costo de comunicar procesos separados.'
      ]],
      ['warn', 'La contracara: como los hilos comparten memoria, si dos tocan el mismo dato al mismo tiempo sin coordinarse, aparecen <b>condiciones de carrera</b> (race conditions) y resultados impredecibles. Eso se resuelve con la sincronización que vemos en la próxima lección.'],
      ['info', 'Diferencia fina: <b>concurrencia</b> es que varias tareas <b>avancen</b> en el mismo período (aunque sea alternándose en un núcleo); <b>paralelismo</b> es que se ejecuten <b>literalmente al mismo tiempo</b> en varios núcleos. Todo paralelismo es concurrencia, pero no al revés.']
    ],
    tasks: [
      { t: 'mcq', q: '¿Qué comparten los hilos de un mismo proceso?', opts: ['Nada, están aislados', 'El espacio de memoria, el código y los archivos abiertos', 'Solo el PID', 'Solo la pila'], a: 1, why: 'Los hilos comparten memoria, código y recursos del proceso; cada uno tiene su propia pila, registros y contador de programa.' },
      { t: 'mcq', q: '¿Por qué crear un hilo suele ser más barato que crear un proceso?', opts: ['Porque usa otro lenguaje', 'Porque no necesita un nuevo espacio de memoria: reutiliza el del proceso', 'Porque no usa CPU', 'Porque no tiene estado'], a: 1, why: 'Un proceso nuevo requiere su propio espacio de memoria aislado; un hilo reutiliza el del proceso, por eso es más liviano.' },
      { t: 'mcq', q: '¿Cuál es la diferencia entre concurrencia y paralelismo?', opts: ['Son lo mismo', 'Concurrencia: varias tareas avanzan en el período (aunque se alternen); paralelismo: se ejecutan a la vez en varios núcleos', 'El paralelismo es más lento', 'La concurrencia necesita varios núcleos'], a: 1, why: 'Concurrencia es progreso simultáneo (puede ser por turnos en un núcleo); paralelismo es ejecución física simultánea en varios núcleos.' },
      { t: 'mcq', q: 'El riesgo principal de que varios hilos compartan memoria es:', opts: ['Que ocupen más disco', 'Las condiciones de carrera si tocan el mismo dato sin coordinarse', 'Que no puedan comunicarse', 'Que usen menos CPU'], a: 1, why: 'Al compartir datos, accesos simultáneos sin sincronización producen condiciones de carrera (resultados impredecibles).' }
    ],
    recap: { remember: ['Hilo = unidad de ejecución dentro de un proceso; comparten memoria.', 'Multihilo da respuesta, paralelismo y recursos compartidos.', 'Concurrencia ≠ paralelismo.'], pitfalls: ['Pensar que los hilos tienen memoria separada.', 'Olvidar que compartir memoria exige sincronizar.'] }
  },
  /* ---- a4 ---- */
  {
    id: 'a4', title: 'Concurrencia, exclusión mutua y deadlock', level: 'Intermedio', mins: 22,
    goal: 'Vas a entender el problema de que varios procesos usen un recurso compartido y las herramientas para coordinarlos. Es el corazón de la materia y lo más preguntado.',
    body: [
      ['p', 'Cuando varios procesos o hilos acceden a un <b>recurso compartido</b> (una variable, un archivo, una impresora), hay que coordinarlos. El fragmento de código que accede a ese recurso se llama <b>sección crítica</b>.'],
      ['h', 'El problema de la sección crítica'],
      ['p', 'Si dos procesos entran a la vez a su sección crítica, pueden dejar el recurso en un estado inconsistente (una <b>condición de carrera</b>). La solución es garantizar <b>exclusión mutua</b>: que <b>solo uno</b> esté dentro de la sección crítica a la vez.'],
      ['p', 'Una solución correcta debe cumplir tres condiciones:'],
      ['ul', ['<b>Exclusión mutua:</b> a lo sumo un proceso en la sección crítica.', '<b>Progreso:</b> si nadie está dentro, un proceso que quiere entrar no puede ser bloqueado indefinidamente.', '<b>Espera limitada:</b> ningún proceso espera para siempre (sin inanición).']],
      ['h', 'Semáforos'],
      ['p', 'Un <b>semáforo</b> es una variable entera con dos operaciones atómicas: <b>wait (P)</b>, que decrementa y bloquea si queda negativo, y <b>signal (V)</b>, que incrementa y libera. Un <b>semáforo binario (mutex)</b> vale 0 o 1 y sirve justo para exclusión mutua:'],
      ['code', 'text', `wait(mutex)        // pedir el candado (entra uno solo)
   ... sección crítica ...
signal(mutex)      // devolver el candado`, { title: 'Exclusión mutua con un semáforo' }],
      ['h', 'Interbloqueo (deadlock)'],
      ['p', 'Un <b>deadlock</b> ocurre cuando un conjunto de procesos queda esperándose mutuamente para siempre: cada uno tiene un recurso y espera el que tiene otro. El ejemplo clásico: P1 tiene A y pide B; P2 tiene B y pide A. Ninguno suelta y ninguno avanza.'],
      ['p', 'Se produce solo si se dan <b>las 4 condiciones de Coffman</b> a la vez:'],
      ['ol', ['<b>Exclusión mutua:</b> el recurso no se comparte.', '<b>Retención y espera:</b> un proceso retiene recursos mientras pide otros.', '<b>No apropiación:</b> un recurso no se le puede quitar por la fuerza.', '<b>Espera circular:</b> hay un ciclo de procesos esperándose.']],
      ['key', 'Para que NO haya deadlock, basta con romper <b>una</b> de las 4 condiciones (por ejemplo, exigir que cada proceso pida todos sus recursos de una, o imponer un orden fijo para pedirlos y así evitar el ciclo).'],
      ['warn', 'No confundas <b>deadlock</b> (todos bloqueados para siempre, nadie avanza) con <b>inanición/starvation</b> (un proceso específico nunca consigue el recurso porque siempre se lo dan a otros, pero el sistema sí avanza).']
    ],
    tasks: [
      { t: 'mcq', q: '¿Qué garantiza la "exclusión mutua"?', opts: ['Que todos los procesos entren juntos a la sección crítica', 'Que a lo sumo un proceso esté en la sección crítica a la vez', 'Que no haya secciones críticas', 'Que la CPU vaya más rápido'], a: 1, why: 'Exclusión mutua = solo uno dentro de la sección crítica en cada momento, evitando condiciones de carrera.' },
      { t: 'mcq', q: '¿Para qué se usa un semáforo binario (mutex)?', opts: ['Para contar procesos', 'Para proteger una sección crítica (que entre uno solo)', 'Para acelerar la E/S', 'Para crear hilos'], a: 1, why: 'El mutex (0/1) actúa como candado: wait toma el acceso, signal lo libera, garantizando exclusión mutua.' },
      { t: 'mcq', q: 'P1 tiene el recurso A y espera B; P2 tiene B y espera A. Ninguno avanza. Esto es:', opts: ['Inanición', 'Un deadlock (interbloqueo)', 'Un cambio de contexto', 'Exclusión mutua'], a: 1, why: 'Es un deadlock por espera circular: cada proceso retiene un recurso y espera el del otro, para siempre.' },
      { t: 'order', q: 'Ordená las 4 condiciones de Coffman para que exista deadlock.', items: ['Exclusión mutua', 'Retención y espera', 'No apropiación', 'Espera circular'], why: 'Las cuatro deben darse simultáneamente; romper una sola evita el interbloqueo.' },
      { t: 'mcq', q: '¿Cuál es la diferencia entre deadlock e inanición?', opts: ['Son lo mismo', 'En deadlock nadie avanza (bloqueo mutuo); en inanición el sistema avanza pero un proceso nunca consigue el recurso', 'La inanición es más grave siempre', 'El deadlock solo pasa con hilos'], a: 1, why: 'Deadlock: bloqueo mutuo total. Inanición: el sistema progresa, pero un proceso específico queda postergado indefinidamente.' }
    ],
    recap: { remember: ['Sección crítica = código que usa un recurso compartido.', 'Semáforo/mutex garantiza exclusión mutua (wait/signal).', 'Deadlock: 4 condiciones de Coffman; romper una lo evita.'], pitfalls: ['Confundir deadlock con inanición.', 'Olvidar hacer signal (soltar el candado) y dejar a todos esperando.'] }
  },
  /* ---- a5 ---- */
  {
    id: 'a5', title: 'Planificación de la CPU', level: 'Avanzado', mins: 22,
    goal: 'Vas a comparar los algoritmos que deciden qué proceso usa la CPU y calcular sus métricas. Es un tema con cuentas que cae seguro en el parcial.',
    body: [
      ['p', 'El <b>planificador (scheduler)</b> decide, de todos los procesos Listos, cuál usa la CPU. Busca objetivos a veces en tensión: maximizar el <b>uso de CPU</b> y el <b>rendimiento</b> (procesos por unidad de tiempo), y minimizar el <b>tiempo de espera</b> y el <b>tiempo de respuesta</b>.'],
      ['table', ['Métrica', 'Qué mide'], [
        ['Tiempo de espera', 'Cuánto esperó en la cola de Listos (sin contar su ejecución)'],
        ['Tiempo de retorno (turnaround)', 'Desde que llega hasta que termina = espera + ráfaga'],
        ['Tiempo de respuesta', 'Desde que llega hasta que empieza a ejecutarse']
      ]],
      ['h', 'Apropiativo vs. no apropiativo'],
      ['p', 'Un algoritmo es <b>no apropiativo</b> si, una vez que un proceso toma la CPU, la usa hasta terminar o bloquearse. Es <b>apropiativo (preemptive)</b> si el SO le puede <b>quitar</b> la CPU para dársela a otro (por tiempo o por prioridad).'],
      ['h', 'Algoritmos clásicos'],
      ['ul', [
        '<b>FCFS (First Come First Served):</b> el primero que llega, primero se atiende. Simple, no apropiativo. Problema: un proceso largo adelante demora a todos (<b>efecto convoy</b>).',
        '<b>SJF (Shortest Job First):</b> primero el de ráfaga más corta. Da el <b>menor tiempo de espera promedio</b>, pero requiere conocer la duración y puede causar inanición de los largos.',
        '<b>SRTF (Shortest Remaining Time First):</b> es el SJF <b>apropiativo</b>. Cuando llega un proceso nuevo, se compara su ráfaga con lo que le falta al que está ejecutando; si es menor, se lo <b>desaloja</b>. Reduce la espera promedio todavía más que SJF, a costa de más cambios de contexto.',
        '<b>Round Robin (RR):</b> cada proceso usa la CPU por un <b>quantum</b> fijo y, si no terminó, vuelve al final de la cola. Apropiativo, justo, ideal para tiempo compartido. El quantum define todo: muy chico = mucho overhead; muy grande = se parece a FCFS.',
        '<b>Por prioridades:</b> ejecuta primero el de mayor prioridad (convención habitual: <b>número menor = prioridad mayor</b>). Riesgo de inanición de los de baja prioridad (se mitiga con <b>aging</b>: subir la prioridad con el tiempo de espera).',
        '<b>Colas multinivel:</b> hay varias colas con distinta prioridad (por ejemplo, interactivos vs. por lotes), cada una con su propio algoritmo. En las <b>multinivel con realimentación</b> un proceso puede bajar de cola si consume mucha CPU o subir si espera demasiado.'
      ]],
      ['h', 'Ejemplo de cálculo (FCFS)'],
      ['p', 'Tres procesos llegan juntos en el orden P1, P2, P3 con ráfagas 4, 2, 6. En FCFS se ejecutan en ese orden:'],
      ['code', 'text', `Tiempo:   0────4──6──────────12
          |  P1  | P2|    P3    |
Espera:   P1 = 0   (empieza ya)
          P2 = 4   (esperó a P1)
          P3 = 6   (esperó a P1 y P2)
Espera promedio = (0 + 4 + 6) / 3 = 3.33`, { title: 'FCFS paso a paso' }],
      ['key', 'Con esas mismas ráfagas, <b>SJF</b> las ordenaría 2, 4, 6 (P2, P1, P3): esperas 0, 2, 6 → promedio 2.67. SJF siempre da el menor promedio de espera, por eso es el "óptimo" teórico.']
    ],
    tasks: [
      { t: 'text', q: 'En FCFS, tres procesos llegan juntos con ráfagas 3, 5, 2 (en ese orden). ¿Cuál es el tiempo de espera TOTAL (sumado)? ', a: ['11'], hint: 'Espera de cada uno = suma de las ráfagas anteriores: 0, 3, 8.', why: 'P1 espera 0, P2 espera 3, P3 espera 3+5=8. Total = 0+3+8 = 11.' },
      { t: 'mcq', q: '¿Qué algoritmo garantiza el MENOR tiempo de espera promedio?', opts: ['FCFS', 'SJF (Shortest Job First)', 'Round Robin', 'Por llegada'], a: 1, why: 'SJF es óptimo para el tiempo de espera promedio, al ejecutar primero las ráfagas más cortas.' },
      { t: 'mcq', q: 'En Round Robin, si el quantum es MUY chico, ¿qué pasa?', opts: ['Se comporta como FCFS', 'Hay demasiados cambios de contexto (mucho overhead)', 'Un proceso monopoliza la CPU', 'No termina ningún proceso'], a: 1, why: 'Un quantum chico provoca muchísimos cambios de contexto; el overhead administrativo se come el tiempo de CPU útil.' },
      { t: 'mcq', q: 'El "efecto convoy" es un problema típico de:', opts: ['Round Robin', 'FCFS (un proceso largo adelante demora a todos)', 'SJF', 'Prioridades con aging'], a: 1, why: 'En FCFS, si un proceso largo llega primero, los cortos que vienen detrás esperan mucho: efecto convoy.' },
      { t: 'mcq', q: '¿Qué es un algoritmo "apropiativo" (preemptive)?', opts: ['El que nunca cambia de proceso', 'El que puede quitarle la CPU a un proceso para dársela a otro', 'El que ejecuta en orden de llegada', 'El que no usa quantum'], a: 1, why: 'Apropiativo significa que el SO puede expropiar la CPU (por tiempo o prioridad). Round Robin es el ejemplo típico.' },
      { t: 'mcq', q: '¿En qué se diferencia SRTF de SJF?', opts: ['SRTF ordena por llegada', 'SRTF es la versión apropiativa: desaloja al proceso en curso si llega otro con menos tiempo restante', 'SRTF no usa ráfagas', 'Son idénticos'], a: 1, why: 'SRTF (Shortest Remaining Time First) es SJF con desalojo: al llegar un proceso más corto, interrumpe al actual.' },
      { t: 'mcq', q: 'En planificación por prioridades con la convención habitual, un proceso con prioridad 1 frente a otro con prioridad 5:', opts: ['Tiene menor prioridad', 'Tiene MAYOR prioridad (número menor = prioridad mayor)', 'Tienen la misma', 'No se puede comparar'], a: 1, why: 'Por la convención usual, el número menor indica mayor prioridad: el de prioridad 1 va primero. (Si tu cátedra usa lo contrario, aplicá la suya.)' }

    recap: { remember: ['FCFS (orden de llegada, efecto convoy), SJF/SRTF (óptimos en espera), RR (quantum), prioridades (aging), colas multinivel.', 'Espera en FCFS = suma de ráfagas anteriores.', 'Apropiativo = se puede quitar la CPU (RR, SRTF).'], pitfalls: ['Olvidar que el tiempo de retorno = espera + ráfaga.', 'Quantum mal elegido en RR (muy chico = overhead; muy grande = FCFS).'] }

  /* ---- a6 ---- */
  {
    id: 'a6', title: 'Gestión de memoria y memoria virtual', level: 'Avanzado', mins: 22,
    goal: 'Vas a entender cómo el SO reparte la RAM entre procesos y cómo logra que parezca haber más memoria de la que hay. Es el tema del segundo parcial.',
    body: [
      ['p', 'La memoria principal (RAM) es limitada y la comparten muchos procesos. El SO debe <b>asignarla, protegerla</b> (que un proceso no lea la de otro) y aprovecharla al máximo.'],
      ['h', 'De particiones a paginación'],
      ['ul', [
        '<b>Particiones:</b> dividir la memoria en bloques para los procesos. Genera <b>fragmentación</b>: queda memoria libre pero en huecos inutilizables (externa) o desperdiciada dentro de un bloque (interna).',
        '<b>Paginación:</b> se divide la memoria física en marcos (frames) de tamaño fijo y la memoria lógica del proceso en <b>páginas</b> del mismo tamaño. Una <b>tabla de páginas</b> mapea cada página a un marco. Así el proceso no necesita estar contiguo en RAM, eliminando la fragmentación externa.',
        '<b>Segmentación:</b> divide según la lógica del programa (código, datos, pila), en bloques de tamaño variable.'
      ]],
      ['h', 'Traducción de direcciones y TLB'],
      ['p', 'El proceso trabaja con <b>direcciones lógicas</b> (página + desplazamiento) y el hardware las convierte en <b>direcciones físicas</b> (marco + desplazamiento) consultando la <b>tabla de páginas</b>. Como esa tabla está en memoria, cada acceso costaría dos lecturas. Para evitarlo existe la <b>TLB</b> (Translation Lookaside Buffer), una pequeña caché de traducciones recientes: si la página está en la TLB (un "acierto"), la traducción es casi instantánea; si no ("fallo de TLB"), se busca en la tabla y se guarda para la próxima.'],
      ['h', 'Memoria virtual'],
      ['p', 'La <b>memoria virtual</b> permite ejecutar procesos que no entran completos en RAM: solo se cargan las páginas que se están usando, y el resto queda en el disco (área de <b>swap</b>). Cada proceso "cree" tener toda la memoria para él.'],
      ['p', 'Cuando un proceso accede a una página que <b>no está en RAM</b>, ocurre un <b>fallo de página (page fault)</b>: el SO la trae del disco a un marco libre y continúa. Si no hay marcos libres, aplica un <b>algoritmo de reemplazo</b> para elegir qué página sacar:'],
      ['table', ['Algoritmo', 'Qué página reemplaza'], [
        ['FIFO', 'La que entró primero'],
        ['LRU', 'La usada hace más tiempo (Least Recently Used)'],
        ['Óptimo', 'La que tardará más en volver a usarse (teórico, ideal)']
      ]],
      ['warn', '<b>Thrashing (hiperpaginación):</b> si hay demasiados procesos y poca RAM, el sistema pasa más tiempo trayendo y sacando páginas del disco que ejecutando. El rendimiento se desploma. Se corrige reduciendo el grado de multiprogramación o agregando RAM.'],
      ['key', 'Idea central: la memoria virtual cambia accesos a RAM (rápidos) por accesos a disco (miles de veces más lentos) solo cuando hace falta. Funciona genial mientras los fallos de página sean pocos; si son muchos (thrashing), es un desastre.'],
      ['info', 'El principio que lo hace viable es la <b>localidad de referencia</b>: los programas tienden a usar, en cada momento, un conjunto acotado de páginas (el "conjunto de trabajo"), no toda su memoria por igual.']
    ],
    tasks: [
      { t: 'mcq', q: '¿Qué resuelve la paginación respecto de las particiones?', opts: ['Hace la CPU más rápida', 'Elimina la fragmentación externa: el proceso no necesita estar contiguo en RAM', 'Elimina la necesidad de disco', 'Permite más colores'], a: 1, why: 'Al mapear páginas a marcos cualquiera, el proceso no requiere memoria contigua, eliminando la fragmentación externa.' },
      { t: 'mcq', q: '¿Qué es un fallo de página (page fault)?', opts: ['Un error que cierra el programa', 'Acceder a una página que no está en RAM, obligando a traerla del disco', 'Quedarse sin disco', 'Un deadlock de memoria'], a: 1, why: 'El page fault no es un error fatal: el SO trae la página faltante desde el disco a RAM y el proceso continúa.' },
      { t: 'mcq', q: 'El algoritmo de reemplazo LRU saca la página que:', opts: ['Entró primero', 'Se usó hace más tiempo (menos recientemente)', 'Es más grande', 'Se usará enseguida'], a: 1, why: 'LRU (Least Recently Used) reemplaza la página usada menos recientemente, apostando a la localidad de referencia.' },
      { t: 'mcq', q: '¿Qué es el thrashing (hiperpaginación)?', opts: ['Un proceso que no termina', 'El sistema pasa más tiempo moviendo páginas entre RAM y disco que ejecutando', 'Un ataque de seguridad', 'Un tipo de deadlock'], a: 1, why: 'Con demasiada demanda y poca RAM, los fallos de página se disparan y el sistema se dedica a paginar, no a computar.' },
      { t: 'text', q: '¿Cómo se llama el principio por el cual un programa usa, en cada momento, un conjunto acotado de páginas y no toda su memoria por igual?', accept: ['localidad','localidad de referencia','principio de localidad'], why: 'La localidad de referencia es lo que hace eficiente a la memoria virtual: alcanza con tener en RAM el conjunto de trabajo.' },
      { t: 'mcq', q: '¿Para qué sirve la TLB?', opts: ['Para guardar las páginas en disco', 'Es una caché de traducciones página→marco recientes, para no leer la tabla de páginas en cada acceso', 'Para reemplazar la RAM', 'Para contar fallos de página'], a: 1, why: 'La TLB acelera la traducción de direcciones: si la página está cacheada, evita la lectura extra de la tabla de páginas en memoria.' }
    ],
    recap: { remember: ['Dirección lógica (página+desplazamiento) → física (marco+desplazamiento) vía tabla de páginas; la TLB la acelera.', 'Memoria virtual: solo las páginas en uso en RAM, el resto en swap.', 'Fallo de página → traer del disco; reemplazo FIFO/LRU/Óptimo.'], pitfalls: ['Pensar que un page fault es un crash (es normal).', 'Ignorar el thrashing cuando hay poca RAM.'] }
  },
  /* ---- a7 ---- */
  {
    id: 'a7', title: 'Gestión de entrada/salida', level: 'Avanzado', mins: 18,
    goal: 'Vas a ver cómo el SO maneja dispositivos muy lentos sin frenar todo, y cómo ordena los pedidos al disco. Cierra el recorrido del segundo parcial.',
    body: [
      ['p', 'Los dispositivos de E/S (disco, teclado, impresora, red) son mucho más lentos que la CPU y muy variados. El SO los uniformiza mediante <b>drivers</b> y aplica técnicas para que su lentitud no frene al resto del sistema.'],

<script>
/* ================= ACADEMIA BYTE — motor ================= */
(function(){
"use strict";
const C8 = window.C8, MODS = C8.modules, GAMES = C8.games, AV = C8.AVATARS, DIAG = C8.DIAGRAMS;
const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const el = (t,c,h)=>{ const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = s=> String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const rich = s=> esc(s).replace(/\{\{(.+?)\}\}/g,'<span class="ic">$1</span>').replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>').replace(/&lt;sup&gt;/g,'<sup>').replace(/&lt;\/sup&gt;/g,'</sup>').replace(/&lt;i&gt;/g,'<i>').replace(/&lt;\/i&gt;/g,'</i>');

/* ---------- storage ---------- */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ---------- estado ---------- */
const S = {
  view:'home', mod:null, lesson:null, game:null,
  db:null, user:null, uid:null, sample:null, isWriter:false,
  prog: LS.get('c8_prog', { xp:0, avatar:'robo', nick:'', tasks:{}, lessons:{}, games:{} })
};
if(!S.prog.tasks) S.prog.tasks={}; if(!S.prog.lessons) S.prog.lessons={}; if(!S.prog.games) S.prog.games={};

/* ---------- niveles ---------- */
const TITLES = ['Novato','Aprendiz','Scripter','Dev Junior','Programador','Full Stack','Hacker Ético','Arquitecto','Ingeniero','Maestro Byte','Leyenda'];
function req(L){ return Math.round(55*(L-1)*L/2); } // xp acumulado para alcanzar nivel L
function levelInfo(xp){
  let L=1; while(L<60 && xp>=req(L+1)) L++;
  const base=req(L), next=req(L+1), into=xp-base, need=next-base;
  return { level:L, title:TITLES[Math.min(L-1,TITLES.length-1)], into, need, pct: Math.max(0,Math.min(100, need?Math.round(into/need*100):100)) };
}

/* ---------- avatar ---------- */
function avatarEl(id, cls){ const a=AV[id]||AV.robo; const d=el('span','av '+(cls||'')); d.style.setProperty('--ac',a.c); d.innerHTML=a.svg(a.c); return d; }

/* ---------- toast / levelup ---------- */
let toastWrap;
function toast(msg, icon){
  if(!toastWrap){ toastWrap=el('div','toast-wrap'); document.body.appendChild(toastWrap); }
  const t=el('div','toast'); t.innerHTML=`<span class="tx">${icon||ICON('star')}</span><span>${msg}</span>`;
  toastWrap.appendChild(t); setTimeout(()=>{ t.style.transition='opacity .4s,transform .4s'; t.style.opacity='0'; t.style.transform='translateY(10px)'; setTimeout(()=>t.remove(),400); }, 2600);
}
function levelUp(n, title){
  const w=el('div','lvlup'); w.innerHTML=`<div class="card">⭐<b>¡Nivel ${n}!</b><span>${esc(title)}</span></div>`; document.body.appendChild(w);
  setTimeout(()=>{ w.style.transition='opacity .4s'; w.style.opacity='0'; setTimeout(()=>w.remove(),400); }, 1700);
}

/* ---------- progreso: guardar + sync ranking ---------- */
function saveProg(){ LS.set('c8_prog', S.prog); syncRanking(); refreshMe(); }
function totalLessons(){ return MODS.reduce((n,m)=>n+m.lessons.length,0); }
function doneLessonsCount(){ return Object.keys(S.prog.lessons).length; }
function modProgress(m){ const done=m.lessons.filter(l=>S.prog.lessons[m.id+':'+l.id]).length; return {done, total:m.lessons.length, pct: Math.round(done/m.lessons.length*100)}; }

function award(xp, reason){
  const before=levelInfo(S.prog.xp).level;
  S.prog.xp += xp;
  const after=levelInfo(S.prog.xp);
  saveProg();
  toast(`+${xp} XP · ${reason}`);
  if(after.level>before) setTimeout(()=>levelUp(after.level, after.title), 400);
}
function taskKey(mid,lid,i){ return mid+':'+lid+':'+i; }
function awardTask(mid,lid,i,xp,reason){
  const k=taskKey(mid,lid,i);
  if(S.prog.tasks[k]) return false;
  S.prog.tasks[k]=1; award(xp, reason); maybeCompleteLesson(mid,lid); return true;
}
function maybeCompleteLesson(mid,lid){
  const m=MODS.find(x=>x.id===mid); const l=m.lessons.find(x=>x.id===lid);
  const all=l.tasks.every((_,i)=>S.prog.tasks[taskKey(mid,lid,i)]);
  const lk=mid+':'+lid;
  if(all && !S.prog.lessons[lk]){ S.prog.lessons[lk]=1; award(15,'¡Lección completada!'); }
}

/* ================= RANKING (db) ================= */
async function initCaps(){
  S.standalone = !(typeof window.claude !== 'undefined' && window.claude && window.claude.use);
  try{ S.user = await window.claude?.use?.('user'); }catch(e){}
  try{ S.db = await window.claude?.use?.('db'); }catch(e){}
  try{ S.sample = await window.claude?.use?.('sample'); }catch(e){}
  if(S.user){ try{ S.uid = await S.user.id(); }catch(e){} try{ S.isWriter = !!(await S.user.can?.('data.write')); }catch(e){ S.isWriter=true; } }
  // cargar progreso remoto propio (persistente entre dispositivos)
  if(S.db && S.uid){
    try{
      const snap = await S.db.doc('data/users/'+S.uid+'/progress').get();
      if(snap.exists){ const d=snap.data(); if(d && typeof d.xp==='number' && (d.xp>=S.prog.xp)){ S.prog={ xp:d.xp, avatar:d.avatar||S.prog.avatar, nick:d.nick||S.prog.nick, tasks:d.tasks||S.prog.tasks, lessons:d.lessons||S.prog.lessons, games:d.games||S.prog.games }; LS.set('c8_prog',S.prog); } }
    }catch(e){}
  }
  if(!S.prog.nick){ try{ S.prog.nick = (await S.user?.me?.())?.name || ''; }catch(e){} }
  refreshMe(); if(S.view==='ranking') renderRanking();
}
let rankTimer;
function syncRanking(){
  // progreso propio privado
  if(S.db && S.uid){
    try{ S.db.doc('data/users/'+S.uid+'/progress').set({ xp:S.prog.xp, avatar:S.prog.avatar, nick:S.prog.nick, tasks:S.prog.tasks, lessons:S.prog.lessons, games:S.prog.games, updated:Date.now() }); }catch(e){}
  }
  // entrada pública de ranking (throttle)
  clearTimeout(rankTimer);
  rankTimer=setTimeout(()=>{
    if(S.db && S.uid && S.isWriter!==false){
      const li=levelInfo(S.prog.xp);
      try{ S.db.doc('ranking/'+S.uid).set({ nick:(S.prog.nick||'Anónimo').slice(0,24), avatar:S.prog.avatar, xp:S.prog.xp, level:li.level, lessons:doneLessonsCount(), updated:Date.now() }); }catch(e){}
    }
  }, 900);
}

/* ================= ROUTER ================= */
function go(view, p){
  p=p||{}; S.view=view; S.mod=p.mod||S.mod; S.lesson=p.lesson||null; S.game=p.game||null;
  if(view==='home') location.hash='home';
  else if(view==='module') location.hash='m-'+S.mod;
  else if(view==='lesson') location.hash='l-'+S.mod+'-'+S.lesson;
  else if(view==='game') location.hash='g-'+S.game;
  else location.hash=view;
  window.scrollTo(0,0);
  renderRail();
  const main=$('#main'); main.innerHTML='';
  if(view==='home') renderHome(main);
  else if(view==='module') renderModule(main);
  else if(view==='lesson') renderLesson(main);
  else if(view==='games') renderGames(main);
  else if(view==='game') renderGame(main);
  else if(view==='ranking') renderRanking(main);
  else if(view==='assistant') renderAssistant(main);
  else if(view==='contact') renderContact(main);
}

function doCopy(txt,btn){ const done=()=>{ const o=btn.textContent; btn.textContent='¡Copiado!'; setTimeout(()=>btn.textContent=o,1200); };
  try{ navigator.clipboard.writeText(txt).then(done,()=>fallback()); }catch(e){ fallback(); }
  function fallback(){ const ta=el('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');done();}catch(e){} ta.remove(); } }

/* ---------- highlight simple ---------- */
const KW={ python:'def|return|if|elif|else|for|while|in|not|and|or|import|from|class|try|except|finally|raise|with|as|lambda|None|True|False|print|range|len|global|nonlocal|yield|break|continue|pass|is',
  cpp:'int|double|char|bool|void|float|long|short|string|return|if|else|for|while|do|switch|case|break|continue|class|struct|public|private|protected|virtual|override|using|namespace|include|const|auto|new|delete|true|false|cout|cin|endl|vector|map|set|sort|srand|rand|this',
  sql:'SELECT|FROM|WHERE|ORDER|BY|GROUP|HAVING|LIMIT|JOIN|INNER|LEFT|RIGHT|FULL|ON|AS|AND|OR|NOT|NULL|IS|IN|BETWEEN|LIKE|DISTINCT|COUNT|SUM|AVG|MIN|MAX|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|VIEW|WITH|DESC|ASC|COALESCE|RANK|OVER|ROUND|BEGIN|COMMIT|ROLLBACK',
  bash:'sudo|cd|ls|ping|traceroute|dig|nslookup|curl|ip|ss|netstat|ifconfig|route', http:'GET|POST|PUT|DELETE|PATCH|HTTP|Host|Accept|Content-Type|Set-Cookie|User-Agent' };
const HLDEF={
  python:{c:/#[^\n]*/, s:/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/},
  bash:{c:/#[^\n]*/, s:/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/},
  cpp:{c:/\/\/[^\n]*/, s:/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'/},
  sql:{c:/--[^\n]*/, s:/'(?:[^'\\]|\\.)*'/},
  http:{s:/"[^"]*"/}, text:{}
};
function hlPlain(code, lang){
  let h=esc(code);
  const kw=KW[lang]; if(kw) h=h.replace(new RegExp('\\b('+kw+')\\b','g'),'<span class="kw">$1</span>');
  h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="nu">$1</span>');
  return h;
}
function highlight(src, lang){
  const def=HLDEF[lang]||{};
  if(!def.c && !def.s) return hlPlain(src, lang);
  const parts=[]; if(def.c) parts.push('('+def.c.source+')'); else parts.push('()');
  parts.push(def.s?'('+def.s.source+')':'()');
  const re=new RegExp(parts.join('|'),'g');
  let out='', last=0, mm;
  while((mm=re.exec(src))){
    if(mm.index<last){ re.lastIndex++; continue; }
    out+=hlPlain(src.slice(last,mm.index), lang);
    if(mm[1]!=null && mm[1]!=='') out+='<span class="cm">'+esc(mm[1])+'</span>';
    else if(mm[2]!=null) out+='<span class="st">'+esc(mm[2])+'</span>';
    last=mm.index+mm[0].length;
    if(mm[0]==='') re.lastIndex++;
  }
  out+=hlPlain(src.slice(last), lang);
  return out;
}

  const ed=el('div','editor'); ed.innerHTML='<div class="ed-top">SQL · base de datos tienda (SQLite)</div>';
  const ta=el('textarea'); ta.spellcheck=false; ta.value=cfg.query||'SELECT * FROM productos;'; ta.rows=Math.min(8,(cfg.query||'').split('\n').length+1); ed.appendChild(ta); body.appendChild(ed);
  const row=el('div'); row.style.cssText='display:flex;gap:8px;margin-top:4px';
  const rb=el('button','btn btn-sm btn-primary',ICON('play',14)+' Ejecutar');

function maskFromCidr(c){ let m=[0,0,0,0]; for(let i=0;i<c;i++) m[Math.floor(i/8)]|=(128>>(i%8)); return m; }
function subnetCalc(){
  const w=el('div','sqlpad'); const b=el('div'); b.style.padding='14px';
  b.innerHTML='<div style="font-weight:600;margin-bottom:8px">🧮 Calculadora de subredes</div>';

  const ip=el('input','ex-input'); ip.value='192.168.10.77'; ip.style.maxWidth='170px';

  row.appendChild(ip); row.appendChild(el('span','','/')); row.appendChild(cidr); b.appendChild(row);
  const out=el('div','console'); out.style.marginTop='12px'; b.appendChild(out);
  const upd=()=>{ const parts=(ip.value||'').split('.').map(x=>parseInt(x)); const c=parseInt(cidr.value);
    if(parts.length!==4||parts.some(x=>isNaN(x)||x<0||x>255)||isNaN(c)||c<1||c>32){ out.innerHTML='<span class="dim">Ingresá una IP válida y un prefijo /1–/32</span>'; return; }
    const m=maskFromCidr(c); const net=parts.map((p,i)=>p&m[i]); const inv=m.map(x=>255-x); const bc=net.map((p,i)=>p|inv[i]);
    const hostBits=32-c; const hosts=hostBits<=1?(hostBits===1?2:1):(Math.pow(2,hostBits)-2);
    const first=net.slice(); first[3]+=1; const last=bc.slice(); last[3]-=1;
    out.innerHTML=`<span class="ok">Máscara:</span> ${m.join('.')}  (/${c})
<span class="ok">Red:</span> ${net.join('.')}
<span class="ok">Broadcast:</span> ${bc.join('.')}
<span class="ok">Rango usable:</span> ${hostBits>=2?first.join('.')+' → '+last.join('.'):'—'}
<span class="ok">Hosts usables:</span> ${hosts}`; };
  ip.oninput=upd; cidr.oninput=upd; upd(); w.appendChild(b); return w;
}

function gridEq(a,b,ordered){
  if(a.error||b.error) return false;
  const ga=(a.rows||[]).map(r=>r.map(c=>c==null?'∅':String(c)));
  const gb=(b.rows||[]).map(r=>r.map(c=>c==null?'∅':String(c)));
  if(ga.length!==gb.length) return false;
  if(ga[0] && gb[0] && ga[0].length!==gb[0].length) return false;
  const key=g=>g.map(r=>r.join('\u0001'));
  if(ordered) return key(ga).join('\u0002')===key(gb).join('\u0002');
  const sa=key(ga).sort(), sb=key(gb).sort(); return sa.join('\u0002')===sb.join('\u0002');
}

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('No se pudo cargar '+src)); document.head.appendChild(s); }); }
async function ensureSkulpt(){ if(skLoaded)return skLoaded; skLoaded=(async()=>{ await loadScript('https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js'); await loadScript('https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js'); })(); return skLoaded; }
async function runPy(code, inputs){
  try{ await ensureSkulpt(); }catch(e){ return {out:'No se pudo cargar el motor de Python (revisá tu conexión).',err:true}; }
  if(typeof Sk==='undefined') return {out:'Motor de Python no disponible.',err:true};
  let out=''; const q=(inputs||[]).slice();
  Sk.configure({ __future__:Sk.python3, output:t=>out+=t, read:f=>{ if(Sk.builtinFiles===undefined||Sk.builtinFiles.files[f]===undefined) throw "No existe el módulo '"+f+"'"; return Sk.builtinFiles.files[f]; },
    inputfun:p=>new Promise(r=>r(q.length?q.shift():'')), inputfunTakesPrompt:true, execLimit:5000, yieldLimit:50 });
  try{ await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,code,true)); return {out:out,err:false}; }
  catch(e){ let msg=(e&&e.toString)?e.toString():'Error'; msg=msg.replace('Program exceeded run time limit.','El programa tardó demasiado (¿bucle infinito?).'); return {out:out+(out?'\n':'')+msg, err:true}; }
}

async function ensureSql(){ if(sqlDB)return sqlDB; if(sqlLoading)return sqlLoading;
  sqlLoading=(async()=>{ await loadScript('https://cdn.jsdelivr.net/npm/sql.js@1.14.2/dist/sql-asm.js'); const SQL=await initSqlJs(); const db=new SQL.Database(); db.run(SQL_SEED); sqlDB=db; return db; })();
  return sqlLoading; }
async function runSql(query){
  let db; try{ db=await ensureSql(); }catch(e){ return {error:'No se pudo cargar el motor SQL (revisá tu conexión).'}; }
  try{ // reset data each run so UPDATE/DELETE de prueba no rompan ejercicios
    const r=db.exec(query); if(!r.length) return {cols:[],rows:[]}; return {cols:r[0].columns, rows:r[0].values};
  }catch(e){ return {error:(e.message||String(e)).replace(/^Error:\s*/,'')}; }
}

function mdLite(t){ let h=esc(t);
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>'<pre>'+c.replace(/\n$/,'')+'</pre>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/^### (.*)$/gm,'<b>$1</b>').replace(/^## (.*)$/gm,'<b>$1</b>');
  h=h.replace(/\n/g,'<br>').replace(/<\/pre><br>/g,'</pre>');
  return h; }

const start=parseHash(); go(start.view,start);
initCaps();
})();
